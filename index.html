<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Brisk Mail</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, fast, precise. IDEA: an air-traffic board for your inbox.
   PICTURE: the working app. COLOUR/TYPE: deep sea #0a2540, sky #8fd3ff, signal pink #ff5c8a; Hanken Grotesk.
   LAYOUT: phone = list then full-screen reader; tablet = list | reader. */
:root{color-scheme:light dark;--rail:#0a2540;--rail2:#123459;--sky:#8fd3ff;--pink:#ff5c8a;
--bg:light-dark(#f4f7fb,#07182c);--panel:light-dark(#fff,#0d2138);--ink:light-dark(#0a2540,#e8f1fb);--mute:light-dark(#5a6b82,#93a8c2);
--line:light-dark(#e1e7ef,#1d3553);--hover:light-dark(#eef4fb,#13304f);--sel:light-dark(#e3f1ff,#17406a);--mark:light-dark(#ffe58a,#7a5d00);--warn:light-dark(#fff1f4,#3a1424)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Hanken Grotesk",system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;border-radius:10px;min-height:40px}
input,textarea,select{font-size:16px}
:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
mark{background:var(--mark);color:inherit;border-radius:3px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
/* layout */
#app{display:flex;flex-direction:column;height:100%}
.top{background:var(--rail);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 4px}
.top .ib{width:44px;height:44px;display:grid;place-items:center;color:#fff}
.sb{flex:1;display:flex;align-items:center;gap:6px;background:var(--rail2);border-radius:12px;padding:0 10px;height:44px}
.sb input{flex:1;border:0;background:none;outline:0;color:#fff;height:44px}
.sb input::placeholder{color:#9fb7d1}
.av{width:36px;height:36px;border-radius:50%;background:var(--sky);color:var(--rail);font-weight:700;display:grid;place-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:0 12px;min-height:34px;font-size:14px;background:var(--panel)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.stat{font-size:13px;color:var(--mute);padding:6px 14px;display:flex;justify-content:space-between;gap:10px}
.stat button{min-height:28px;color:var(--mute);font-size:13px;display:flex;align-items:center;gap:4px}
#rows{flex:1;overflow-y:auto;background:var(--panel);overscroll-behavior:contain}
.rw{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.rw .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#fff;font-weight:600}
.rw .under.l{background:#2e8bd6}.rw .under.r{background:var(--pink)}
.row{position:relative;display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:0 12px;padding:11px 14px 11px 0;background:var(--panel);cursor:pointer;touch-action:pan-y}
.row.sel{background:var(--sel)}
.row .bar{grid-row:span 3;border-radius:0 3px 3px 0}
.row .from{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row.unread .from,.row.unread .subj{font-weight:700}
.row.unread .from::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-right:6px;vertical-align:2px}
.row .time{font-size:13px;color:var(--mute);white-space:nowrap;display:flex;gap:4px;align-items:center}
.row .time svg{width:14px;height:14px}
.row .subj,.row .snip{grid-column:2/4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .snip{font-size:13.5px;color:var(--mute)}
.row .star{color:#e8a200}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:5px;padding:0 6px;margin-right:6px;color:#fff;vertical-align:1px;white-space:nowrap}
.more{display:block;margin:12px auto;border:1px solid var(--line);padding:0 18px}
.empty{padding:48px 24px;text-align:center;color:var(--mute)}
.fab{position:fixed;right:18px;bottom:22px;background:var(--pink);color:#fff;font-weight:600;border-radius:16px;min-height:56px;padding:0 20px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(255,92,138,.4);z-index:3}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,12,24,.5);z-index:8}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--rail);color:#dbe9f7;z-index:9;overflow-y:auto;padding:16px 10px 30px;transform:translateX(-102%);transition:transform .2s}
#drawer.open{transform:none}
.brand{font-weight:300;font-size:30px;color:#fff;padding:0 10px}.brand b{font-weight:700;color:var(--sky)}
.acct{font-size:13px;color:#8aa3bf;padding:0 10px 12px}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:0 12px;color:#cfe0f2;min-height:44px}
.nav.on{background:var(--rail2);color:#fff;font-weight:600}
#drawer h4{font-size:13px;font-weight:500;color:#8aa3bf;margin:16px 12px 4px}
.set{padding:4px 12px;font-size:14px}
.set input,.set select,.set textarea{width:100%;background:var(--rail2);border:1px solid #24486f;border-radius:8px;color:#fff;padding:8px 10px;margin:4px 0}
.set label{display:flex;gap:10px;align-items:center;min-height:40px}
.set label input{width:auto}
.rule{display:flex;align-items:center;gap:8px;font-size:14px;min-height:36px}
.rule button{margin-left:auto;color:#ff9ab5;min-height:32px;padding:0 8px}
.lite{border:1px solid #2b5079;color:#fff;padding:0 14px;margin:6px 0}
/* reader */
#reader{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s}
#reader.open{transform:none}
.rbar{display:flex;align-items:center;gap:2px;padding:6px;background:var(--panel);border-bottom:1px solid var(--line)}
.rbar .ib{width:44px;height:44px;display:grid;place-items:center}
.rbar .sp{flex:1}
.rbody{flex:1;overflow-y:auto;padding:18px 16px 120px}
.rbody h1{font-size:24px;line-height:1.15;margin:0 0 10px;font-weight:600;text-wrap:balance}
.meta{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.meta .av{width:40px;height:40px;flex:none}
.meta .who{flex:1;font-size:14px}.meta .who b{font-size:15px}
.meta .who span{color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagbtn{min-height:30px;padding:0;margin-bottom:10px}
.tldr{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sky);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.tldr b{font-size:12.5px;color:var(--mute);font-weight:600;display:block}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fact{font-size:13px;background:var(--hover);border-radius:6px;padding:2px 8px;white-space:nowrap}
.warn{background:var(--warn);border:1px solid var(--pink);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:10px}
.warn svg{color:var(--pink)}
.imgbar{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-bottom:8px}
.imgbar button{min-height:30px;color:#2e8bd6;font-weight:600;padding:0}
.frame{width:100%;border:0;background:#fff;border-radius:10px;min-height:120px;display:block}
.text{white-space:pre-wrap;font-size:16px;line-height:1.6;overflow-wrap:anywhere}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.att{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;background:var(--panel);max-width:100%}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.quick button{border:1px solid var(--sky);padding:0 14px;border-radius:999px;font-size:14px}
.loading{color:var(--mute);padding:20px 0}
.rfoot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 14px 16px;background:linear-gradient(transparent,var(--bg) 30%)}
.rfoot button{flex:1;border:1px solid var(--line);background:var(--panel);display:flex;gap:8px;align-items:center;justify-content:center;min-height:48px;font-weight:600}
/* compose */
#compose{position:fixed;inset:0;background:var(--panel);z-index:7;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .2s}
#compose.open{transform:none}
.cbody{flex:1;overflow-y:auto;padding:0 14px 20px;display:flex;flex-direction:column}
.field{display:flex;align-items:center;border-bottom:1px solid var(--line);gap:8px}
.field label{width:58px;color:var(--mute);font-size:14px}
.field input{flex:1;border:0;background:none;min-height:48px;outline:0}
.field button{color:var(--mute);min-height:36px;padding:0 6px;font-size:14px}
#cbody{flex:1;min-height:240px;border:0;background:none;outline:0;padding:14px 0;resize:none;line-height:1.55}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files .att button{min-height:24px;padding:0 0 0 4px;color:var(--mute)}
.send{background:var(--pink);color:#fff;font-weight:600;padding:0 18px;min-height:44px;display:flex;gap:8px;align-items:center}
.send[disabled]{opacity:.6}
.check{border-top:1px solid var(--line);background:var(--bg)}
.chead{display:flex;align-items:center;gap:10px;padding:8px 14px;width:100%;text-align:left;min-height:48px;border-radius:0}
.score{font-size:22px;font-weight:300}
.chead small{color:var(--mute);font-size:13px;flex:1}
.chead .fixall{border:1px solid var(--line);padding:0 12px;min-height:36px;font-size:14px;background:var(--panel)}
#issues{max-height:34vh;overflow-y:auto;padding:0 14px 12px}
.issue{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.issue .k{font-size:12px;font-weight:700;width:100%}
.k.sp{color:var(--pink)}.k.gr{color:#2e8bd6}.k.st{color:#c88a00}
.issue .w{text-decoration:line-through;opacity:.7}
.issue button{border:1px solid var(--line);padding:0 10px;min-height:32px;font-size:13px;margin-left:auto}
.issue button+button{margin-left:0}
/* login */
#login{position:fixed;inset:0;background:var(--rail);color:#e8f1fb;overflow-y:auto;z-index:20;padding:clamp(24px,6vh,60px) 22px 40px}
#login .in{max-width:440px;margin:0 auto}
#login h1{font-weight:300;font-size:48px;line-height:1;margin:0 0 6px;color:#fff}#login h1 b{font-weight:700;color:var(--sky)}
#login p{color:#a9c0d8;margin:0 0 22px}
#login label{display:block;font-size:14px;color:#a9c0d8;margin:14px 0 4px}
#login input{width:100%;height:50px;border-radius:12px;border:1px solid #2b5079;background:var(--rail2);color:#fff;padding:0 14px;outline:0}
#login .go{width:100%;background:var(--pink);color:#fff;font-weight:700;min-height:52px;margin-top:18px;font-size:16px}
#login ol{padding-left:20px;color:#cfe0f2;font-size:14.5px}
#login ol li{margin-bottom:8px}
#login a,#login .lk{color:var(--sky);font-weight:600;text-decoration:none;padding:0;min-height:0}
.err{color:#ffb3c7;font-size:14px;margin-top:10px;min-height:20px}
.how{background:var(--rail2);border-radius:14px;padding:14px 16px;margin-top:26px}
.how h3{margin:0 0 8px;font-size:16px;color:#fff}
/* dialog + toast */
#dlg{position:fixed;inset:0;background:rgba(4,12,24,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
#dlg .box{background:var(--panel);border-radius:16px;padding:20px;max-width:380px;width:100%}
#dlg .box p{margin:0 0 16px}
#dlg .btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#dlg .btns button{padding:0 14px;border:1px solid var(--line)}
#dlg .btns .pri{background:var(--pink);color:#fff;border-color:var(--pink)}
.lpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,160px);background:#0a2540;color:#fff;border-radius:12px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;z-index:40;font-size:14px;max-width:92vw;transition:transform .2s;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.show{transform:translate(-50%,0)}
.toast button{color:var(--sky);font-weight:700;padding:0 10px}
.provs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.prov{border:1px solid #2b5079;color:#cfe0f2;border-radius:999px;padding:0 14px;min-height:38px;font-size:14px}
.prov.on{background:var(--sky);color:var(--rail);border-color:var(--sky);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.abadge{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;margin-left:4px}
.acctline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-left:8px;vertical-align:4px}
.accsec{border-top:1px solid #1d3d62;margin-top:8px;padding-top:6px}
.acchead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:0 12px;color:#fff;font-weight:600;min-height:44px}
.acchead span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acchead small{color:#8aa3bf;font-weight:400;font-size:12px}
.nav.rm{color:#ff9ab5;font-size:13px;min-height:36px}
.nav.addacc{color:var(--sky);font-weight:600;margin-top:8px;border-top:1px solid #1d3d62;border-radius:0}
.field select{flex:1;border:0;background:none;min-height:48px;outline:0;font-size:16px}
.selbar{display:none;background:#123459;color:#fff;align-items:center;gap:2px;padding:8px 6px}
.selbar .ib{width:44px;height:44px;display:grid;place-items:center;color:#fff}
.selbar b{flex:1;font-size:16px;padding-left:4px;white-space:nowrap}
.selbar .txt{color:var(--sky);font-weight:700;padding:0 10px;min-height:44px}
#app.picking .top{display:none}#app.picking .selbar{display:flex}#app.picking .fab{display:none}
.row{-webkit-user-select:none;user-select:none}
.ck{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--mute);margin-right:8px;vertical-align:-4px;font-size:12px;line-height:1;color:transparent;flex:none}
.row.picked{background:var(--sel)}.row.picked .ck{background:#2e8bd6;border-color:#2e8bd6;color:#fff}
#app.picking .row.unread .from::before{display:none}
.stat .acts{display:flex;gap:4px;align-items:center}
@media(min-width:900px){
 body{display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr)}
 #app{border-right:1px solid var(--line)}
 #reader{position:relative;inset:auto;transform:none;transition:none;z-index:1}
 #reader .back{display:none}
 .rbody{padding:28px 36px 120px}.rbody h1{font-size:30px}
 .fab{left:calc(min(440px,100vw) - 190px);right:auto}
 #compose{left:auto;right:24px;bottom:0;top:auto;width:min(680px,60vw);height:86vh;border-radius:16px 16px 0 0;box-shadow:0 20px 60px rgba(0,0,0,.3)}
}
@media(prefers-reduced-motion:reduce){#drawer,#reader,#compose,.toast{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>

 <symbol id="i-mail" viewBox="0 0 24 24"><path d="M2 5h20v14H2zM2 6l10 7 10-7"/></symbol>
 <symbol id="i-reply" viewBox="0 0 24 24"><path d="M9 17l-5-5 5-5M4 12h11a5 5 0 0 1 5 5v2"/></symbol>
 <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M15 17l5-5-5-5M20 12H9a5 5 0 0 0-5 5v2"/></symbol>
 <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
 <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></symbol>
 <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>

 <symbol id="i-spam" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></symbol>

</svg>

<!-- add account -->
<div id="login" class="hide">
 <div class="in">
  <button class="lk hide" id="lcancel" style="margin-bottom:16px">← Back to mail</button>
  <h1>Brisk<b>.</b></h1>
  <p id="lintro">All your email in one place: colour-coded, searchable in a blink, and checked before you hit send.</p>
  <div class="provs" id="provs"></div>
  <form id="lform">
   <label for="lemail">Email address</label>
   <input id="lemail" type="email" autocomplete="email" placeholder="you@gmail.com" required>
   <label for="lpass" id="lpasslabel">App password</label>
   <input id="lpass" type="password" autocomplete="off" required>
   <div id="custom" class="hide">
    <label for="limap">Incoming (IMAP) server</label><input id="limap" placeholder="imap.example.com" autocapitalize="off">
    <div class="two"><div><label for="limapport">Port</label><input id="limapport" inputmode="numeric" value="993"></div>
     <div><label for="lsmtpport">SMTP port</label><input id="lsmtpport" inputmode="numeric" value="465"></div></div>
    <label for="lsmtp">Outgoing (SMTP) server</label><input id="lsmtp" placeholder="smtp.example.com" autocapitalize="off">
    <label for="luser">Username (if not your email address)</label><input id="luser" autocapitalize="off" autocomplete="off">
   </div>
   <button class="go" type="submit" id="lgo">Add account</button>
   <div class="err" id="lerr" role="alert"></div>
  </form>
  <div class="how" id="how"></div>
 </div>
</div>

<div id="app">
 <header class="top">
  <button class="ib" id="menubtn" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
  <div class="sb"><svg class="i" style="opacity:.7"><use href="#i-search"/></svg>
   <input id="q" type="search" placeholder="Search all mail" autocomplete="off" aria-label="Search mail" spellcheck="false"></div>
  <button class="av" id="avbtn" aria-label="Accounts">B</button>
 </header>
 <div class="selbar" id="selbar" role="toolbar" aria-label="Selected emails">
  <button class="ib" id="selx" aria-label="Cancel selection"><svg class="i"><use href="#i-close"/></svg></button>
  <b id="selcount">Select emails</b>
  <button class="txt" data-bulk="all" id="selall">All</button>
  <button class="ib" data-bulk="read" aria-label="Mark read or unread" title="Read / unread"><svg class="i"><use href="#i-mail"/></svg></button>

/* ================= colour labels ================= */
const LABELS = {

  travel:{name:'Travel',c:'#0f9a90',kw:['flight','booking','hotel','check-in','boarding','train','trip','itinerary','airbnb','reservation']},
  deliveries:{name:'Deliveries',c:'#d98a00',kw:['delivery','delivered','parcel','dispatched','shipped','tracking','order','courier','out for delivery']},
  work:{name:'Work',c:'#5b6cff',kw:['project','deadline','report','client','proposal','review','release','build','meeting notes','contract']},
  personal:{name:'Personal',c:'#c2410c',kw:['mum','dad','birthday','dinner','weekend','party','love','mate','family']},

const ACOL = ['#2e8bd6', '#e8336b', '#0f9a90', '#d98a00', '#5b6cff', '#c2410c'];
let rules = ls.get('brisk-rules', []);
function classify(m) {
  const from = (m.from + ' ' + m.email).toLowerCase(), subj = (m.subj || '').toLowerCase();
  for (const r of rules) {
    const t = r.text.toLowerCase();

  }

  let best = null, bs = 0;
  for (const [k, L] of Object.entries(LABELS)) {
    let s = 0;
    for (const w of L.kw) { const n = txt.split(w).length - 1; if (n) s += n * (subj.includes(w) ? 3 : 1); }
    if (s > bs) { bs = s; best = k; }
  }
  return best || 'work';
}

/* ================= state ================= */
const VIEWS = [['inbox','Inbox','inbox'],['starred','Starred','star'],['important','Important','shield'],['sent','Sent','send'],['drafts','Drafts','pen'],['archive','Archive','archive'],['all','All mail','archive'],['spam','Spam','spam'],['trash','Bin','trash']];
const S = {accounts:[], folders:{}, acct:'all', view:'inbox', src:[], items:[], more:false, filter:null, sel:null, query:'', server:null, sbusy:0, cur:null, loading:false, showImg:false, plain:false};
let cache = ls.get('brisk-cache2', {});
let settings = ls.get('brisk-settings', {name:'', sig:'', images:false});
let trusted = new Set(ls.get('brisk-trusted', []));
const key = m => m.acct + '|' + m.folder + '|' + m.uid;
const ck = (acct, path) => acct + '|' + path;
const isWide = () => matchMedia('(min-width:900px)').matches;
const accById = id => S.accounts.find(a => a.id === id);
const spOf = id => (S.folders[id] && S.folders[id].special) || {inbox:'INBOX'};
const acol = id => ACOL[Math.max(0, S.accounts.findIndex(a => a.id === id)) % ACOL.length];
const multi = () => S.accounts.length > 1;
function saveCache() { for (const p in cache) cache[p] = cache[p].slice(0, 300); ls.set('brisk-cache2', cache); }
function allCached() {
  const seen = new Set(), out = [];
  for (const p in cache) {
    if (!accById(p.split('|')[0])) continue;
    for (const m of cache[p]) { const sig = m.acct + '|' + m.email + '|' + m.subj + '|' + m.t; if (!seen.has(sig)) { seen.add(sig); out.push(m); } }
  }

}
function withLabel(list) { for (const m of list) m.label = classify(m); return list; }

/* ================= search engine ================= */
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++) { let p = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] === b[j - 1] ? 0 : 1)); p = t; } }
  return d[b.length];
}
function parse(q) {
  const o = {terms:[], phrases:[], neg:[], ops:[]};
  q.replace(/(-?)"([^"]+)"|(\S+)/g, (_, n, ph, w) => {
    if (ph) { (n ? o.neg : o.phrases).push(ph.toLowerCase()); return; }
    const m = w.match(/^(from|to|label|subject|has|is|before|after|in):(.+)$/i);
    if (m) o.ops.push([m[1].toLowerCase(), m[2].toLowerCase()]);
    else if (w.startsWith('-') && w.length > 1) o.neg.push(w.slice(1).toLowerCase());
    else if (!/^(or|and)$/i.test(w)) o.terms.push(w.toLowerCase());
  });
  return o;
}
const colourOf = v => Object.keys(LABELS).find(k => LABELS[k].name.toLowerCase().startsWith(v) || k.startsWith(v));
function opsOk(m, o) {
  const from = (m.from + ' ' + m.email).toLowerCase();
  for (const [k, v] of o.ops) {
    if (k === 'from' && !from.includes(v)) return false;
    if (k === 'to' && !(m.to || '').toLowerCase().includes(v)) return false;
    if (k === 'subject' && !(m.subj || '').toLowerCase().includes(v)) return false;
    if (k === 'label') { const c = colourOf(v); if (c && m.label !== c) return false; }
    if (k === 'has' && v.startsWith('attach') && !m.att) return false;
    if (k === 'is' && ((v === 'unread' && m.seen) || (v === 'read' && !m.seen) || (v === 'starred' && !m.star))) return false;
    if (k === 'before' || k === 'after') { const d = new Date(v.replace(/\//g, '-')).getTime(); if (!isNaN(d) && (k === 'before' ? m.t >= d : m.t < d + 864e5)) return false; }
  }
  return true;
}
function localSearch(list, q) {
  const o = parse(q), out = [];
  for (const m of list) {
    if (!opsOk(m, o)) continue;
    const f = {subj:(m.subj||'').toLowerCase(), from:(m.from + ' ' + m.email).toLowerCase(), body:(m.snip||'').toLowerCase()};
    const all = f.subj + ' ' + f.from + ' ' + f.body;
    if (o.neg.some(n => all.includes(n)) || o.phrases.some(p => !all.includes(p))) continue;
    let score = o.phrases.length * 5 + o.ops.length, ok = true; const hits = [...o.phrases];
    let words = null;
    for (const t of o.terms) {
      let s = 0;
      if (f.subj.includes(t)) s += 6; if (f.from.includes(t)) s += 4; if (f.body.includes(t)) s += 2;
      if (s) hits.push(t);
      else if (t.length >= 4) { words = words || (all.match(/[a-z0-9£.\-]+/g) || []);
        const w = words.find(w => lev(w, t) <= (t.length > 6 ? 2 : 1)); if (w) { s = 1; hits.push(w); } }
      if (!s) { ok = false; break; }
      score += s;
    }
    if (ok) out.push({m, score: score + m.t / 1e13, hits});
  }
  return out.sort((a, b) => b.score - a.score);
}
function gmailQuery(q) {
  return q.replace(/\blabel:(\S+)/gi, (w, v) => colourOf(v.toLowerCase()) ? '' : w)
          .replace(/\b(before|after):(\d{4})-(\d{1,2})-(\d{1,2})/gi, '$1:$2/$3/$4').trim();
}
function hl(text, hits) {
  const s = esc(text); if (!hits || !hits.length) return s;
  const re = new RegExp('(' + hits.map(h => esc(h).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return s.replace(re, '<mark>$1</mark>');
}

/* ================= list ================= */
function fmt(t) {
  const d = new Date(t), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  if (d.getFullYear() === n.getFullYear()) return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
  return d.toLocaleDateString('en-GB');
}
let shown = [];
function rowHtml(m, hits) {
  const L = LABELS[m.label] || LABELS.work, sp = spOf(m.acct);
  const who = m.folder === sp.sent || m.folder === sp.drafts ? 'To: ' + (m.to || '') : m.from;
  const a = accById(m.acct);
  const badge = multi() && (S.acct === 'all' || S.query) && a ? `<span class="abadge" style="background:${acol(m.acct)}" title="${esc(a.email)}">${esc(({gmail:'G',virgin:'V',yahoo:'Y',icloud:'i'})[a.provider] || a.email[0].toUpperCase())}</span>` : '';
  return `<div class="rw" data-k="${esc(key(m))}"><div class="under"><span>${ico('archive')}</span><span>${ico('trash')}</span></div>
  <div class="row ${m.seen ? '' : 'unread'} ${S.sel === key(m) && !S.pick ? 'sel' : ''} ${picked.has(key(m)) ? 'picked' : ''}" role="listitem" tabindex="0"${S.pick ? ` aria-selected="${picked.has(key(m))}"` : ''}>
   <span class="bar" style="background:${L.c}"></span>
   <span class="from">${S.pick ? '<span class="ck">✓</span>' : ''}${hl(who, hits)}</span>
   <span class="time">${m.star ? `<span class="star">★</span>` : ''}${m.att ? ico('clip') : ''}${fmt(m.t)}${badge}</span>
   <span class="subj"><span class="tag" style="background:${L.c}">${L.name}</span>${hl(m.subj, hits)}</span>
   <span class="snip">${hl(m.snip || ' ', hits)}</span></div></div>`;
}
function renderChips() {
  $('chips').innerHTML = `<button class="chip ${S.filter ? '' : 'on'}" data-l="">All</button>` +
    Object.entries(LABELS).map(([k, L]) => `<button class="chip ${S.filter === k ? 'on' : ''}" data-l="${k}"><span class="dot" style="background:${L.c}"></span>${L.name}</button>`).join('');
}
function viewTitle() {
  if (S.acct === 'all') return multi() ? 'All inboxes' : 'Inbox';
  const v = VIEWS.find(x => x[0] === S.view), a = accById(S.acct);
  const name = S.view === 'label' ? S.src[0].path.replace(/^\[(Gmail|Google Mail)\]\//, '') : v ? v[1] : '';
  return name + (multi() && a ? ' · ' + a.email : '');
}
function renderList() {
  let html, stat;
  if (S.query) {
    const t0 = performance.now();
    const local = localSearch(allCached(), S.query);
    const ms = (performance.now() - t0).toFixed(0);
    const sigs = new Set(local.map(r => r.m.acct + '|' + r.m.email + '|' + r.m.subj + '|' + r.m.t));
    const o = parse(S.query);
    const server = (S.server || []).filter(m => !sigs.has(m.acct + '|' + m.email + '|' + m.subj + '|' + m.t) && opsOk(m, o));
    const terms = o.terms.concat(o.phrases);
    shown = local.map(r => r.m).concat(server);
    html = local.map(r => rowHtml(r.m, r.hits)).join('') + server.map(m => rowHtml(m, terms)).join('');
    stat = `${local.length} instant (${ms} ms)` + (DEMO ? '' : S.sbusy ? ` · searching ${multi() ? 'all accounts' : 'the server'}…` : S.server ? ` · ${server.length} more from the server` : '');
    if (!shown.length && !S.sbusy) html = `<div class="empty">Nothing matches “${esc(S.query)}”.<br>Try fewer words, or remove an operator.</div>`;
  } else {
    shown = S.filter ? S.items.filter(m => m.label === S.filter) : S.items;
    html = shown.map(m => rowHtml(m)).join('');
    if (!shown.length) html = `<div class="empty">${S.loading ? 'Loading…' : S.filter ? 'No ' + LABELS[S.filter].name.toLowerCase() + ' here.' : 'All clear. Nothing here.'}</div>`;
    else if (S.more) html += `<button class="more" id="more">Load older emails</button>`;
    const unread = S.items.filter(m => !m.seen).length;
    stat = viewTitle() + (S.filter ? ' · ' + LABELS[S.filter].name : '') + (unread ? ` · ${unread} unread` : '') + (S.loading ? ' · syncing…' : '');
  }
  $('rows').innerHTML = html;
  $('stat').textContent = stat;
}

/* ================= loading ================= */
const PAGE = 40;
function sources() {
  if (S.acct === 'all') return S.accounts.map(a => ({acct: a.id, path: 'INBOX'}));
  return S.src;
}
async function loadView(reset) {
  const src = sources(), token = S.src = src;
  if (reset) { S.items = withLabel(src.flatMap(s => (cache[ck(s.acct, s.path)] || []).slice())).sort((a, b) => b.t - a.t); }
  S.loading = true; renderList();
  const results = await Promise.all(src.map(async s => {
    try {
      const r = await call('list', {acct: s.acct, folder: s.path, offset: 0, count: PAGE});
      const old = new Map((cache[ck(s.acct, s.path)] || []).map(m => [key(m), m]));
      const items = withLabel(r.items.map(m => { const o = old.get(key(m)); if (o && o.snip != null) m.snip = o.snip; return m; }));
      cache[ck(s.acct, s.path)] = items;
      s.total = r.total; s.loaded = items.length;
      return items;
    } catch (e) { toast((multi() ? (accById(s.acct) || {}).email + ': ' : '') + e.message); s.total = 0; s.loaded = 0; return (cache[ck(s.acct, s.path)] || []); }
  }));
  if (S.src !== token) return;
  let items = results.flat().sort((a, b) => b.t - a.t);
  if (pending) { const gone = new Set(pending.items.map(key)); items = items.filter(m => !gone.has(key(m))); }
  S.items = items; S.more = src.some(s => s.loaded < s.total);
  saveCache(); S.loading = false; renderList();
  src.forEach(s => snippets(s.acct, s.path, cache[ck(s.acct, s.path)] || []));
}
async function loadMore() {
  const src = S.src;
  await Promise.all(src.filter(s => s.loaded < s.total).map(async s => {
    try {
      const r = await call('list', {acct: s.acct, folder: s.path, offset: s.loaded, count: PAGE});
      const have = new Set(S.items.map(key));
      const add = withLabel(r.items.filter(m => !have.has(key(m))));
      s.loaded += r.items.length; s.total = r.total;
      S.items = S.items.concat(add);
      cache[ck(s.acct, s.path)] = (cache[ck(s.acct, s.path)] || []).concat(add);
      snippets(s.acct, s.path, add);

function setView(acct, view, path) {
  flush(); S.pick = false; picked.clear(); $('app').classList.remove('picking'); S.acct = acct; S.view = view; S.src = acct === 'all' ? [] : [{acct, path: path || 'INBOX'}];
  S.filter = null; S.sel = null; S.query = ''; S.server = null; $('q').value = '';
  $('reader').classList.remove('open'); renderChips(); renderReader(); loadView(true);
}

/* ================= dialog ================= */
function dialog(html, btns, after) {
  $('dlgbox').innerHTML = html + `<div class="btns">${btns.map((b, i) => `<button data-b="${i}" class="${b[1] || ''}">${esc(b[0])}</button>`).join('')}</div>`;
  $('dlg').classList.remove('hide');
  $('dlgbox').querySelectorAll('[data-b]').forEach(el => el.onclick = () => { const b = btns[+el.dataset.b]; closeDialog(); if (b[2]) b[2](); });
  if (after) after($('dlgbox'));
}
function closeDialog() { $('dlg').classList.add('hide'); }
$('dlg').onclick = e => { if (e.target.id === 'dlg') closeDialog(); };

/* ================= events ================= */
$('chips').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; S.filter = c.dataset.l || null; renderChips(); renderList(); };
$('rows').onclick = e => {
  if (e.target.id === 'more') return loadMore();
  const rw = e.target.closest('.rw'); if (!rw || rw.dataset.swiped) return;
  if (Date.now() - lpAt < 600) return;
  if (S.pick) return togglePick(rw.dataset.k);
  const m = byKey(rw.dataset.k); if (m) openMail(m);
};
$('rows').addEventListener('contextmenu', e => {
  const rw = e.target.closest('.rw'); if (!rw) return;
  e.preventDefault(); if (Date.now() - lpAt < 800) return;
  S.pick ? togglePick(rw.dataset.k) : startPick(rw.dataset.k);
});
$('rows').onkeydown = e => { if (e.key === 'Enter') { const rw = e.target.closest('.rw'); const m = rw && byKey(rw.dataset.k); if (m) openMail(m); } };
$('reader').onclick = e => {
  const a = e.target.closest('[data-a]'); if (a) return readerAction(a.dataset.a);
  const q = e.target.closest('[data-qr]'); if (q) return openCompose('reply', byKey(S.sel), q.dataset.qr);
  const at = e.target.closest('[data-att]');
  if (at) { const m = byKey(S.sel); toast('Saving…'); call('attachment', {acct: m.acct, folder: m.folder, uid: m.uid, idx: +at.dataset.att}).then(r => toast('Saved to ' + r.saved)).catch(er => toast(er.message)); }
  const ln = e.target.closest('a[data-ext]'); if (ln) { e.preventDefault(); openUrl(ln.href); }
};
$('fab').onclick = () => openCompose();
$('refresh').onclick = () => S.query ? runServer() : loadView(false);
let qt, st;
$('q').addEventListener('input', e => {
  S.query = e.target.value.trim(); S.server = null; clearTimeout(qt); clearTimeout(st);
  qt = setTimeout(renderList, 60);
  if (S.query && !DEMO) { S.sbusy = 1; st = setTimeout(runServer, 550); } else S.sbusy = 0;
});
async function runServer() {
  const q = S.query; if (!q) return;
  const o = parse(q), terms = o.terms.concat(o.phrases), gq = gmailQuery(q);
  const jobs = [];
  for (const a of S.accounts) {
    const sp = spOf(a.id);
    if (a.gmail) { if (gq) jobs.push({acct: a.id, folder: sp.all || 'INBOX', query: gq}); }
    else if (terms.length) [...new Set(['INBOX', sp.archive, sp.sent].filter(Boolean))].forEach(f => jobs.push({acct: a.id, folder: f, terms}));
  }
  if (!jobs.length) { S.sbusy = 0; S.server = []; renderList(); return; }
  S.sbusy = jobs.length; S.server = []; renderList();
  const known = new Map(allCached().map(m => [key(m), m]));
  await Promise.all(jobs.map(async j => {
    try {
      const r = await call('search', {...j, count: 60});
      if (q !== S.query) return;
      const items = withLabel(r.items.map(m => { const k = known.get(key(m)); if (k && k.snip) m.snip = k.snip; return m; }));
      const have = new Set(S.server.map(key));
      S.server = S.server.concat(items.filter(m => !have.has(key(m)))).sort((a, b) => b.t - a.t);
      snippets(j.acct, j.folder, items);
    } catch (e) { if (q === S.query) toast(((accById(j.acct) || {}).email || '') + ': ' + e.message); }
    S.sbusy = Math.max(0, S.sbusy - 1); if (q === S.query) renderList();
  }));
}
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === 'Escape') { window.briskBack(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || $('compose').classList.contains('open') || !$('dlg').classList.contains('hide') || !$('login').classList.contains('hide')) return;
  const i = shown.findIndex(m => key(m) === S.sel), m = S.sel && byKey(S.sel), k = e.key;
  const go = n => { if (n) { openMail(n); const el = document.querySelector(`.rw[data-k="${CSS.escape(key(n))}"]`); if (el) el.scrollIntoView({block: 'nearest'}); } };
  if (k === '/') { e.preventDefault(); $('q').focus(); }
  else if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); go(shown[Math.min(shown.length - 1, i + 1)]); }
  else if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); go(shown[Math.max(0, i - 1)]); }
  else if (k === 'c') { e.preventDefault(); openCompose(); }
  else if (k === 'x' && S.sel) { S.pick ? togglePick(S.sel) : startPick(S.sel); }
  else if (S.pick && (k === '#' || k === 'Delete')) { const its = [...picked].map(byKey).filter(Boolean); if (its.length) { clearPick(); move(its, 'trash'); } }
  else if (S.pick && k === 'e') { const its = [...picked].map(byKey).filter(Boolean); if (its.length) { clearPick(); move(its, 'archive'); } }
  else if (m && k === 'e') move([m], 'archive');
  else if (m && k === '#') move([m], 'trash');
  else if (m && k === 's') flag(m, m.star ? 'unstar' : 'star');
  else if (m && k === 'u') { flag(m, 'unread'); closeReader(); }
  else if (m && k === 'r') { e.preventDefault(); openCompose('reply', m); }
  else if (m && k === 'f') { e.preventDefault(); openCompose('fwd', m); }
});
window.briskBack = () => {
  if (!$('dlg').classList.contains('hide')) { closeDialog(); return true; }
  if (S.pick && !$('compose').classList.contains('open')) { clearPick(); return true; }
  if (!$('login').classList.contains('hide') && S.accounts.length) { showLogin(false); return true; }
  if ($('compose').classList.contains('open')) { $('cclose').click(); return true; }
  if ($('drawer').classList.contains('open')) { openDrawer(false); return true; }
  if ($('reader').classList.contains('open') && !isWide()) { closeReader(); return true; }
  if (S.query) { $('q').value = ''; S.query = ''; S.server = null; renderList(); return true; }
  if (S.filter) { S.filter = null; renderChips(); renderList(); return true; }
  if (S.acct !== 'all' || S.view !== 'inbox') { setView(multi() ? 'all' : S.accounts[0].id, 'inbox', 'INBOX'); return true; }
  flush(); return false;
};
setInterval(() => { if (!document.hidden && S.accounts.length && !S.query && !pending && $('login').classList.contains('hide')) loadView(false); }, 90000);

/* ================= accounts + start ================= */
function showLogin(on) {
  $('login').classList.toggle('hide', !on);
  $('lcancel').classList.toggle('hide', !S.accounts.length);
  $('lintro').textContent = S.accounts.length ? 'Add another email account. Its inbox joins the others in All inboxes.' : 'All your email in one place: colour-coded, searchable in a blink, and checked before you hit send.';
  $('lgo').textContent = 'Add account'; $('lerr').textContent = '';
  if (on) { $('lemail').value = ''; $('lpass').value = ''; setProv('gmail'); }
}
$('lcancel').onclick = () => showLogin(false);
$('lform').onsubmit = async e => {
  e.preventDefault(); $('lerr').textContent = '';
  const P = PROVIDERS[prov], email = $('lemail').value.trim();
  const args = {email, password: $('lpass').value, provider: prov,
    imapHost: prov === 'other' ? $('limap').value.trim() : P.imap[0], imapPort: prov === 'other' ? +$('limapport').value || 993 : P.imap[1],
    smtpHost: prov === 'other' ? $('lsmtp').value.trim() : P.smtp[0], smtpPort: prov === 'other' ? +$('lsmtpport').value || 465 : P.smtp[1],
    smtpSec: prov === 'other' ? (+$('lsmtpport').value === 587 ? 'starttls' : 'ssl') : P.smtp[2], user: prov === 'other' ? $('luser').value.trim() : ''};
  if (!args.imapHost || !args.smtpHost) { $('lerr').textContent = 'Enter both server names.'; return; }
  $('lgo').disabled = true; $('lgo').textContent = 'Connecting…';
  try {
    const a = await call('login', args); $('lpass').value = '';
    S.accounts.push(a); showLogin(false);
    await loadFolders(a.id);
    setView(multi() ? 'all' : a.id, 'inbox', 'INBOX');
    toast('Added ' + a.email);
  } catch (er) { $('lerr').textContent = er.message; }
  $('lgo').disabled = false; $('lgo').textContent = 'Add account';
};
async function loadFolders(id) {
  try { S.folders[id] = await call('folders', {acct: id}); ls.set('brisk-folders2', S.folders); } catch (e) {}
}
function updateAvatar() { $('avbtn').textContent = (settings.name || (S.accounts[0] || {}).email || 'B')[0].toUpperCase(); }
async function start(accounts) {
  S.accounts = accounts; updateAvatar();
  const saved = ls.get('brisk-folders2', {});
  for (const a of accounts) if (saved[a.id]) S.folders[a.id] = saved[a.id];
  renderChips(); renderReader();
  setView(multi() ? 'all' : accounts[0].id, 'inbox', 'INBOX');
  accounts.forEach(a => loadFolders(a.id));
}
(async () => {
  renderChips(); setProv('gmail');
  try { const s = await call('status'); if (s.accounts && s.accounts.length) return start(s.accounts); } catch (e) {}
  showLogin(true);
})();

/* ================= preview mode (in a browser, no phone engine) ================= */
function demo(m, a) {
  const T = (d, h, mi = 0) => new Date(2026, 10, d, h, mi).getTime();
  const M = [
    ['g',1,'Sarah Collins','sarah@brightlane.co.uk','Project review moved to Tuesday','Hi,\n\nQuick one, the project review with the client has moved to Tuesday 24 Nov at 2pm. Same Teams link as before.\n\nCan you bring the updated report?\n\nThanks,\nSarah',T(20,14,42),false,false,true],

    ['v',4,'The Verge','newsletter@theverge.com','This week in tech: the newsletter edition','This week: new phones, a big AI release and the best streaming boxes of the year. Unsubscribe any time.',T(18,7,0),true,false,false],
    ['g',6,'Priya Shah','priya@northgate.com','Quick call about the invoice','Could we have a quick call about invoice INV-3381? Our finance team has the amount as £2,450 but the PO says £2,540.',T(17,16,45),true,false,false]
  ].map(([acct, uid, from, email, subj, body, t, seen, star, att]) => ({acct, uid, folder:'INBOX', from, email, to:'me', subj, body, t, seen, star, att}));
  const wait = v => new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(v))), 120));
  const fail = msg => new Promise((_, r) => setTimeout(() => r(new Error(msg)), 300));
  const ACCS = [{id:'g', email:'dave@gmail.com', provider:'gmail', gmail:true}, {id:'v', email:'dave@virginmedia.com', provider:'virgin', gmail:false}];
  if (m === 'status') return wait({accounts: location.hash === '#demo' ? ACCS : []});
  if (m === 'login') return wait({id: 'n' + Date.now(), email: a.email, provider: a.provider, gmail: a.provider === 'gmail'});
  if (m === 'folders') return wait(a.acct === 'v' ? {special:{inbox:'INBOX', sent:'Sent', trash:'Trash', spam:'Spam', drafts:'Drafts', archive:'Archive'}, labels:[]} : {special:{inbox:'INBOX', all:'[Gmail]/All Mail', sent:'[Gmail]/Sent Mail', trash:'[Gmail]/Bin', starred:'[Gmail]/Starred', spam:'[Gmail]/Spam', drafts:'[Gmail]/Drafts'}, labels:['Receipts']});
  if (m === 'list') { const it = a.folder === 'INBOX' ? M.filter(x => x.acct === a.acct) : []; return wait({total: it.length, items: it.map(({body, ...x}) => x)}); }
  if (m === 'snippets') return wait(Object.fromEntries(M.filter(x => x.acct === a.acct).map(x => [x.uid, x.body.replace(/\s+/g, ' ')])));
  if (m === 'body') { const x = M.find(y => y.uid === a.uid && y.acct === a.acct); return wait({...x, text: x.body, html: null, attachments: x.att ? [{idx:0, name:'Statement.pdf', size:88000}] : [], unsub: /newsletter/.test(x.email) ? '<https://example.com/unsub>' : '', messageId:'<x@y>', references:'', cc:'', replyTo:''}); }
  if (m === 'send' || m === 'act' || m === 'logout') return wait({});
  return fail('Not available in preview');
}
