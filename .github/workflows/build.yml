name: Build Brisk APK

# Self-contained: this one file generates the whole Android project,
# so the repo only needs index.html plus this workflow.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          set -e
          rm -rf android
          mkdir -p android
          cat > android/settings.gradle <<'BRISK_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Brisk"
          include ':app'
          BRISK_EOF
          mkdir -p android
          cat > android/build.gradle <<'BRISK_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          BRISK_EOF
          mkdir -p android
          cat > android/gradle.properties <<'BRISK_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          BRISK_EOF
          mkdir -p android/app
          cat > android/app/build.gradle <<'BRISK_EOF'
          plugins {
              id 'com.android.application'
          }

          def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

          android {
              namespace 'com.daveg27.brisk'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.daveg27.brisk'
                  minSdk 26
                  targetSdk 34
                  versionCode runNo
                  versionName "1.0.${runNo}"
              }

              signingConfigs {
                  // Fixed key so each new build installs over the previous one.
                  brisk {
                      storeFile file('brisk.keystore')
                      storePassword 'brisk-mail-key'
                      keyAlias 'brisk'
                      keyPassword 'brisk-mail-key'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.brisk
                  }
                  debug {
                      signingConfig signingConfigs.brisk
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/DEPENDENCIES']
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              // JavaMail for Android: IMAP (reading/searching Gmail) and SMTP (sending)
              implementation 'com.sun.mail:android-mail:1.6.7'
              implementation 'com.sun.mail:android-activation:1.6.7'
          }
          BRISK_EOF
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'BRISK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="Brisk"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/BriskTheme"
                  android:hardwareAccelerated="true"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode|density"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          BRISK_EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'BRISK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="BriskTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/brisk_light</item>
                  <item name="android:statusBarColor">@color/brisk_bg</item>
                  <item name="android:navigationBarColor">@color/brisk_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          BRISK_EOF
          mkdir -p android/app/src/main/res/values-night
          cat > android/app/src/main/res/values-night/styles.xml <<'BRISK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="BriskTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/brisk_dark</item>
                  <item name="android:statusBarColor">@color/brisk_bg</item>
                  <item name="android:navigationBarColor">@color/brisk_bg</item>
              </style>
          </resources>
          BRISK_EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml <<'BRISK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="brisk_bg">#0A2540</color>
              <color name="brisk_light">#F4F7FB</color>
              <color name="brisk_dark">#07182C</color>
          </resources>
          BRISK_EOF
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher_fg.xml <<'BRISK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M34,38h40a4,4 0 0,1 4,4v26a4,4 0 0,1 -4,4h-40a4,4 0 0,1 -4,-4v-26a4,4 0 0,1 4,-4z"/>
              <path android:strokeColor="#0A2540" android:strokeWidth="3.2" android:strokeLineJoin="round" android:strokeLineCap="round"
                  android:pathData="M32,41L54,57L76,41"/>
              <path android:fillColor="#FF5C8A" android:pathData="M74,30a8,8 0 1,1 0,16a8,8 0 1,1 0,-16z"/>
              <path android:fillColor="#8FD3FF" android:pathData="M30,76h22v4h-22z"/>
              <path android:fillColor="#FF5C8A" android:pathData="M55,76h10v4h-10z"/>
          </vector>
          BRISK_EOF
          mkdir -p android/app/src/main/res/mipmap-anydpi
          cat > android/app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'BRISK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/brisk_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          BRISK_EOF
          mkdir -p android/app/src/main/res/mipmap-anydpi
          cat > android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml <<'BRISK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/brisk_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          BRISK_EOF
          mkdir -p android/app/src/main/java/com/daveg27/brisk
          cat > android/app/src/main/java/com/daveg27/brisk/MainActivity.java <<'BRISK_EOF'
          package com.daveg27.brisk;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Message;
          import android.provider.MediaStore;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.util.Base64;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.KeyStore;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Properties;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          import javax.activation.DataHandler;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.mail.Address;
          import javax.mail.FetchProfile;
          import javax.mail.Flags;
          import javax.mail.Folder;
          import javax.mail.Multipart;
          import javax.mail.Part;
          import javax.mail.Session;
          import javax.mail.Transport;
          import javax.mail.UIDFolder;
          import javax.mail.internet.InternetAddress;
          import javax.mail.internet.MimeBodyPart;
          import javax.mail.internet.MimeMessage;
          import javax.mail.internet.MimeMultipart;
          import javax.mail.search.AndTerm;
          import javax.mail.search.BodyTerm;
          import javax.mail.search.FromStringTerm;
          import javax.mail.search.OrTerm;
          import javax.mail.search.SearchTerm;
          import javax.mail.search.SubjectTerm;
          import javax.mail.util.ByteArrayDataSource;

          import com.sun.mail.iap.Argument;
          import com.sun.mail.iap.Response;
          import com.sun.mail.imap.IMAPFolder;
          import com.sun.mail.imap.IMAPMessage;
          import com.sun.mail.imap.IMAPStore;
          import com.sun.mail.imap.protocol.IMAPResponse;

          /**
           * Brisk Mail: the UI (assets/index.html) runs in a WebView; this class is the
           * native mail engine. JS calls BriskNative.call(id, method, jsonArgs) and gets
           * the answer back through window.__brisk(id, ok, data).
           * Any number of IMAP/SMTP accounts (Gmail, Virgin Media, Yahoo, iCloud, others),
           * each with an app password stored encrypted with a key in the Android Keystore.
           */
          public class MainActivity extends Activity {

              private static final int REQ_FILE = 51;

              private WebView web;
              private final ExecutorService imapPool = Executors.newFixedThreadPool(4);
              private final ExecutorService smtpPool = Executors.newSingleThreadExecutor();
              private ValueCallback<Uri[]> fileCallback;

              /** One mail account and its live IMAP connection. All IMAP work on it is done while holding its lock. */
              private static class Acct {
                  String id, email, user, provider, imapHost, smtpHost, smtpSec, pw;
                  int imapPort, smtpPort;
                  IMAPStore store;
                  final Map<String, IMAPFolder> open = new HashMap<>();

                  boolean gmail() { return "imap.gmail.com".equalsIgnoreCase(imapHost); }

                  JSONObject pub() throws Exception {
                      JSONObject o = new JSONObject();
                      o.put("id", id); o.put("email", email); o.put("provider", provider); o.put("gmail", gmail());
                      return o;
                  }
              }

              private final Map<String, Acct> accounts = new LinkedHashMap<>();

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Window w = getWindow();
                  w.setStatusBarColor(Color.parseColor("#0A2540"));
                  w.setNavigationBarColor(Color.parseColor("#0A2540"));

                  web = new WebView(this);
                  boolean night = (getResources().getConfiguration().uiMode
                          & android.content.res.Configuration.UI_MODE_NIGHT_MASK) == android.content.res.Configuration.UI_MODE_NIGHT_YES;
                  web.setBackgroundColor(Color.parseColor(night ? "#07182C" : "#F4F7FB"));
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setSupportMultipleWindows(true);
                  s.setTextZoom(100);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("file:") || u.startsWith("about:") || u.startsWith("data:")) return false;
                          openExternal(u);
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          try {
                              Intent i = p.createIntent();
                              i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                              startActivityForResult(i, REQ_FILE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }

                      /* Links in email (target=_blank) open in the phone's browser. */
                      @Override
                      public boolean onCreateWindow(WebView v, boolean dialog, boolean user, Message msg) {
                          WebView tmp = new WebView(MainActivity.this);
                          tmp.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView t, WebResourceRequest r) {
                                  openExternal(r.getUrl().toString());
                                  t.destroy();
                                  return true;
                              }
                          });
                          ((WebView.WebViewTransport) msg.obj).setWebView(tmp);
                          msg.sendToTarget();
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "BriskNative");
                  loadAccounts();
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE && fileCallback != null) {
                      Uri[] out = null;
                      if (res == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              out = new Uri[n];
                              for (int i = 0; i < n; i++) out[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data.getData() != null) {
                              out = new Uri[]{data.getData()};
                          }
                      }
                      fileCallback.onReceiveValue(out);
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(req, res, data);
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("window.briskBack ? String(window.briskBack()) : 'false'", v -> {
                      if (v == null || !v.contains("true")) finish();
                  });
              }

              @Override
              protected void onDestroy() {
                  imapPool.execute(() -> {
                      List<Acct> list;
                      synchronized (accounts) { list = new ArrayList<>(accounts.values()); }
                      for (Acct a : list) synchronized (a) { closeAll(a); }
                  });
                  super.onDestroy();
              }

              private void openExternal(String url) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                  } catch (Exception ignored) { }
              }

              /* ---------------- credentials (AES-GCM, key in Android Keystore) ---------------- */

              private SecretKey key() throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (!ks.containsAlias("brisk")) {
                      KeyGenerator kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                      kg.init(new KeyGenParameterSpec.Builder("brisk",
                              KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                              .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                              .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                              .build());
                      kg.generateKey();
                  }
                  return (SecretKey) ks.getKey("brisk", null);
              }

              private String enc(String plain) throws Exception {
                  Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
                  c.init(Cipher.ENCRYPT_MODE, key());
                  byte[] ct = c.doFinal(plain.getBytes(StandardCharsets.UTF_8));
                  return Base64.encodeToString(c.getIV(), Base64.NO_WRAP) + ":" + Base64.encodeToString(ct, Base64.NO_WRAP);
              }

              private String dec(String blob) throws Exception {
                  String[] parts = blob.split(":");
                  Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
                  c.init(Cipher.DECRYPT_MODE, key(), new GCMParameterSpec(128, Base64.decode(parts[0], Base64.NO_WRAP)));
                  return new String(c.doFinal(Base64.decode(parts[1], Base64.NO_WRAP)), StandardCharsets.UTF_8);
              }

              private SharedPreferences prefs() {
                  return getSharedPreferences("brisk", Context.MODE_PRIVATE);
              }

              private void saveAccounts() throws Exception {
                  JSONArray arr = new JSONArray();
                  SharedPreferences.Editor ed = prefs().edit();
                  List<Acct> list;
                  synchronized (accounts) { list = new ArrayList<>(accounts.values()); }
                  for (Acct a : list) {
                      JSONObject o = new JSONObject();
                      o.put("id", a.id); o.put("email", a.email); o.put("user", a.user); o.put("provider", a.provider);
                      o.put("imapHost", a.imapHost); o.put("imapPort", a.imapPort);
                      o.put("smtpHost", a.smtpHost); o.put("smtpPort", a.smtpPort); o.put("smtpSec", a.smtpSec);
                      arr.put(o);
                      ed.putString("pw_" + a.id, enc(a.pw));
                  }
                  ed.putString("accounts", arr.toString()).apply();
              }

              private void loadAccounts() {
                  SharedPreferences p = prefs();
                  try {
                      String old = p.getString("email", null), oldPw = p.getString("pw", null);
                      if (old != null && oldPw != null && p.getString("accounts", null) == null) {
                          // Version 1 stored a single Gmail account: move it into the account list.
                          Acct a = gmailAcct(old, dec(oldPw));
                          accounts.put(a.id, a);
                          saveAccounts();
                          p.edit().remove("email").remove("pw").apply();
                          return;
                      }
                      JSONArray arr = new JSONArray(p.getString("accounts", "[]"));
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          Acct a = new Acct();
                          a.id = o.getString("id"); a.email = o.getString("email"); a.user = o.optString("user", a.email);
                          a.provider = o.optString("provider", "other");
                          a.imapHost = o.getString("imapHost"); a.imapPort = o.optInt("imapPort", 993);
                          a.smtpHost = o.getString("smtpHost"); a.smtpPort = o.optInt("smtpPort", 465);
                          a.smtpSec = o.optString("smtpSec", "ssl");
                          String blob = p.getString("pw_" + a.id, null);
                          if (blob == null) continue;
                          try { a.pw = dec(blob); } catch (Exception e) { continue; }
                          accounts.put(a.id, a);
                      }
                  } catch (Exception ignored) { }
              }

              private static Acct gmailAcct(String email, String pw) {
                  Acct a = new Acct();
                  a.id = UUID.randomUUID().toString().substring(0, 8);
                  a.email = email; a.user = email; a.pw = pw; a.provider = "gmail";
                  a.imapHost = "imap.gmail.com"; a.imapPort = 993;
                  a.smtpHost = "smtp.gmail.com"; a.smtpPort = 465; a.smtpSec = "ssl";
                  return a;
              }

              /* ---------------- IMAP plumbing ---------------- */

              private static IMAPStore connect(Acct a) throws Exception {
                  Properties pr = new Properties();
                  pr.put("mail.store.protocol", "imaps");
                  pr.put("mail.imaps.host", a.imapHost);
                  pr.put("mail.imaps.port", String.valueOf(a.imapPort));
                  pr.put("mail.imaps.connectiontimeout", "15000");
                  pr.put("mail.imaps.timeout", "30000");
                  pr.put("mail.imaps.partialfetch", "false");
                  Session s = Session.getInstance(pr);
                  IMAPStore st = (IMAPStore) s.getStore("imaps");
                  st.connect(a.imapHost, a.imapPort, a.user, a.pw);
                  return st;
              }

              private static IMAPStore store(Acct a) throws Exception {
                  if (a.store != null && a.store.isConnected()) return a.store;
                  closeAll(a);
                  a.store = connect(a);
                  return a.store;
              }

              private static IMAPFolder folder(Acct a, String path) throws Exception {
                  IMAPFolder f = a.open.get(path);
                  if (f != null && f.isOpen()) return f;
                  f = (IMAPFolder) store(a).getFolder(path);
                  f.open(Folder.READ_WRITE);
                  a.open.put(path, f);
                  return f;
              }

              private static void closeAll(Acct a) {
                  for (IMAPFolder f : a.open.values()) {
                      try { if (f.isOpen()) f.close(false); } catch (Exception ignored) { }
                  }
                  a.open.clear();
                  try { if (a.store != null) a.store.close(); } catch (Exception ignored) { }
                  a.store = null;
              }

              private Acct acct(JSONObject args) throws Exception {
                  Acct a;
                  synchronized (accounts) { a = accounts.get(args.optString("acct", "")); }
                  if (a == null) throw new Exception("That account isn't signed in any more");
                  return a;
              }

              private static String addrs(Address[] a) {
                  if (a == null) return "";
                  StringBuilder sb = new StringBuilder();
                  for (Address x : a) {
                      if (sb.length() > 0) sb.append(", ");
                      sb.append(x instanceof InternetAddress ? ((InternetAddress) x).toUnicodeString() : x.toString());
                  }
                  return sb.toString();
              }

              private static JSONObject summary(Acct acct, IMAPFolder f, javax.mail.Message m) throws Exception {
                  JSONObject o = new JSONObject();
                  o.put("acct", acct.id);
                  o.put("uid", f.getUID(m));
                  o.put("folder", f.getFullName());
                  Address[] fr = m.getFrom();
                  InternetAddress a = fr != null && fr.length > 0 && fr[0] instanceof InternetAddress ? (InternetAddress) fr[0] : null;
                  String name = a == null ? "(unknown)" : (a.getPersonal() != null && !a.getPersonal().trim().isEmpty() ? a.getPersonal() : a.getAddress());
                  o.put("from", name);
                  o.put("email", a == null || a.getAddress() == null ? "" : a.getAddress());
                  o.put("to", addrs(m.getRecipients(javax.mail.Message.RecipientType.TO)));
                  String subj = m.getSubject();
                  o.put("subj", subj == null || subj.trim().isEmpty() ? "(no subject)" : subj);
                  java.util.Date d = m.getReceivedDate();
                  if (d == null) d = m.getSentDate();
                  o.put("t", d == null ? 0 : d.getTime());
                  o.put("seen", m.isSet(Flags.Flag.SEEN));
                  o.put("star", m.isSet(Flags.Flag.FLAGGED));
                  String ct = m.getContentType();
                  o.put("att", ct != null && ct.toLowerCase().startsWith("multipart/mixed"));
                  return o;
              }

              private static FetchProfile listProfile() {
                  FetchProfile fp = new FetchProfile();
                  fp.add(FetchProfile.Item.ENVELOPE);
                  fp.add(FetchProfile.Item.FLAGS);
                  fp.add(FetchProfile.Item.CONTENT_INFO);
                  fp.add(UIDFolder.FetchProfileItem.UID);
                  return fp;
              }

              private static JSONArray summaries(Acct a, IMAPFolder f, javax.mail.Message[] ms) throws Exception {
                  List<javax.mail.Message> ok = new ArrayList<>();
                  for (javax.mail.Message m : ms) if (m != null) ok.add(m);
                  javax.mail.Message[] arr = ok.toArray(new javax.mail.Message[0]);
                  f.fetch(arr, listProfile());
                  JSONArray items = new JSONArray();
                  for (int i = arr.length - 1; i >= 0; i--) {
                      try { items.put(summary(a, f, arr[i])); } catch (Exception ignored) { }
                  }
                  return items;
              }

              /* ---- body walking ---- */
              private static class Body {
                  String text, html;
                  final List<Part> atts = new ArrayList<>();
              }

              private static String str(Object c) throws Exception {
                  if (c instanceof String) return (String) c;
                  if (c instanceof InputStream) return new String(readAll((InputStream) c), StandardCharsets.UTF_8);
                  return c == null ? "" : c.toString();
              }

              private static byte[] readAll(InputStream in) throws Exception {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[16384];
                  int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  in.close();
                  return bo.toByteArray();
              }

              private static void walk(Part p, Body b) throws Exception {
                  String disp = p.getDisposition(), fn = null;
                  try { fn = p.getFileName(); } catch (Exception ignored) { }
                  if (p.isMimeType("multipart/*")) {
                      Multipart mp = (Multipart) p.getContent();
                      for (int i = 0; i < mp.getCount(); i++) walk(mp.getBodyPart(i), b);
                  } else if (p.isMimeType("message/rfc822")) {
                      Object c = p.getContent();
                      if (c instanceof Part) walk((Part) c, b);
                  } else if (Part.ATTACHMENT.equalsIgnoreCase(disp) || (fn != null && !p.isMimeType("text/*"))) {
                      b.atts.add(p);
                  } else if (p.isMimeType("text/plain")) {
                      if (b.text == null) b.text = str(p.getContent());
                  } else if (p.isMimeType("text/html")) {
                      if (b.html == null) b.html = str(p.getContent());
                  } else if (fn != null) {
                      b.atts.add(p);
                  }
              }

              private static String plain(Body b) {
                  if (b.text != null && !b.text.trim().isEmpty()) return b.text;
                  if (b.html == null) return "";
                  String h = b.html.replaceAll("(?is)<(style|script|head)[^>]*>.*?</\\1>", " ")
                          .replaceAll("(?i)<br\\s*/?>|</p>|</div>|</tr>|</h[1-6]>", "\n")
                          .replaceAll("<[^>]+>", " ")
                          .replace("&nbsp;", " ").replace("&amp;", "&").replace("&lt;", "<")
                          .replace("&gt;", ">").replace("&quot;", "\"").replace("&#39;", "'").replace("&pound;", "£");
                  return h.replaceAll("[ \\t\\x0B\\f\\r]+", " ").replaceAll("\\n\\s*\\n+", "\n\n").trim();
              }

              private static String header(javax.mail.Message m, String name) throws Exception {
                  String[] h = m.getHeader(name);
                  return h == null || h.length == 0 ? "" : h[0];
              }

              private static javax.mail.Message byUid(IMAPFolder f, long uid) throws Exception {
                  javax.mail.Message m = f.getMessageByUID(uid);
                  if (m == null) throw new Exception("That email no longer exists");
                  return m;
              }

              private static long[] longs(JSONArray a) throws Exception {
                  long[] u = new long[a.length()];
                  for (int i = 0; i < u.length; i++) u[i] = a.getLong(i);
                  return u;
              }

              /** Folder role from its name, for servers that don't mark special folders (Virgin Media and others). */
              private static String roleByName(String name) {
                  String n = name.toLowerCase().trim();
                  switch (n) {
                      case "archive": case "archives": return "archive";
                      case "sent": case "sent items": case "sent messages": case "sent mail": return "sent";
                      case "trash": case "deleted": case "deleted items": case "deleted messages": case "bin": return "trash";
                      case "spam": case "junk": case "junk e-mail": case "junk email": case "bulk mail": case "bulk": return "spam";
                      case "drafts": case "draft": return "drafts";
                      default: return null;
                  }
              }

              /* ---------------- methods callable from the UI ---------------- */

              private Object run(String method, JSONObject a) throws Exception {
                  switch (method) {
                      case "status": {
                          JSONArray arr = new JSONArray();
                          synchronized (accounts) { for (Acct x : accounts.values()) arr.put(x.pub()); }
                          JSONObject o = new JSONObject();
                          o.put("accounts", arr);
                          return o;
                      }
                      case "login": {
                          Acct n = new Acct();
                          n.id = UUID.randomUUID().toString().substring(0, 8);
                          n.email = a.getString("email").trim();
                          n.user = a.optString("user", "").trim();
                          if (n.user.isEmpty()) n.user = n.email;
                          n.pw = a.getString("password");
                          n.provider = a.optString("provider", "other");
                          if ("gmail".equals(n.provider)) n.pw = n.pw.replace(" ", "");
                          n.imapHost = a.getString("imapHost").trim();
                          n.imapPort = a.optInt("imapPort", 993);
                          n.smtpHost = a.getString("smtpHost").trim();
                          n.smtpPort = a.optInt("smtpPort", 465);
                          n.smtpSec = a.optString("smtpSec", "ssl");
                          synchronized (accounts) {
                              for (Acct x : accounts.values())
                                  if (x.email.equalsIgnoreCase(n.email)) throw new Exception(n.email + " is already added");
                          }
                          try {
                              n.store = connect(n);
                          } catch (javax.mail.AuthenticationFailedException ex) {
                              throw new Exception("The server rejected that email or password. Check you used an app password, not your normal one.");
                          }
                          synchronized (accounts) { accounts.put(n.id, n); }
                          saveAccounts();
                          return n.pub();
                      }
                      case "logout": {
                          Acct x;
                          synchronized (accounts) { x = accounts.remove(a.optString("acct", "")); }
                          if (x != null) {
                              synchronized (x) { closeAll(x); }
                              prefs().edit().remove("pw_" + x.id).apply();
                              saveAccounts();
                          }
                          return new JSONObject();
                      }
                      default: {
                          Acct x = acct(a);
                          synchronized (x) {
                              try {
                                  return runFor(x, method, a);
                              } catch (javax.mail.FolderClosedException | javax.mail.StoreClosedException ex) {
                                  closeAll(x); // dropped connection: reconnect once and retry
                                  return runFor(x, method, a);
                              }
                          }
                      }
                  }
              }

              private Object runFor(Acct acct, String method, JSONObject a) throws Exception {
                  switch (method) {
                      case "folders": {
                          JSONObject sp = new JSONObject();
                          JSONArray labels = new JSONArray();
                          sp.put("inbox", "INBOX");
                          Map<String, String> byName = new HashMap<>();
                          for (Folder f : store(acct).getDefaultFolder().list("*")) {
                              String[] attrs = ((IMAPFolder) f).getAttributes();
                              String role = null;
                              boolean noSelect = false;
                              for (String at : attrs) {
                                  switch (at) {
                                      case "\\All": role = "all"; break;
                                      case "\\Archive": role = "archive"; break;
                                      case "\\Sent": role = "sent"; break;
                                      case "\\Trash": role = "trash"; break;
                                      case "\\Drafts": role = "drafts"; break;
                                      case "\\Junk": role = "spam"; break;
                                      case "\\Flagged": role = "starred"; break;
                                      case "\\Important": role = "important"; break;
                                      case "\\Noselect": case "\\NonExistent": noSelect = true; break;
                                      default: break;
                                  }
                              }
                              if (noSelect) continue;
                              String full = f.getFullName();
                              if (role != null) sp.put(role, full);
                              else if (!"INBOX".equalsIgnoreCase(full)) {
                                  String r = roleByName(f.getName());
                                  if (r != null && !byName.containsKey(r)) byName.put(r, full);
                                  else labels.put(full);
                              }
                          }
                          for (Map.Entry<String, String> e : byName.entrySet()) {
                              if (!sp.has(e.getKey())) sp.put(e.getKey(), e.getValue());
                              else labels.put(e.getValue());
                          }
                          JSONObject o = new JSONObject();
                          o.put("special", sp);
                          o.put("labels", labels);
                          return o;
                      }
                      case "list": {
                          IMAPFolder f = folder(acct, a.getString("folder"));
                          int offset = a.optInt("offset", 0), count = a.optInt("count", 40);
                          int total = f.getMessageCount();
                          int end = total - offset, start = Math.max(1, end - count + 1);
                          JSONObject o = new JSONObject();
                          o.put("total", total);
                          o.put("items", end >= 1 ? summaries(acct, f, f.getMessages(start, end)) : new JSONArray());
                          return o;
                      }
                      case "snippets": {
                          IMAPFolder f = folder(acct, a.getString("folder"));
                          JSONObject out = new JSONObject();
                          for (javax.mail.Message m : f.getMessagesByUID(longs(a.getJSONArray("uids")))) {
                              if (m == null) continue;
                              try {
                                  ((IMAPMessage) m).setPeek(true);
                                  Body b = new Body();
                                  walk(m, b);
                                  String t = plain(b).replaceAll("\\s+", " ").trim();
                                  out.put(String.valueOf(f.getUID(m)), t.length() > 600 ? t.substring(0, 600) : t);
                              } catch (Exception ignored) { }
                          }
                          return out;
                      }
                      case "body": {
                          IMAPFolder f = folder(acct, a.getString("folder"));
                          javax.mail.Message m = byUid(f, a.getLong("uid"));
                          ((IMAPMessage) m).setPeek(true);
                          Body b = new Body();
                          walk(m, b);
                          if (!m.isSet(Flags.Flag.SEEN)) m.setFlag(Flags.Flag.SEEN, true);
                          JSONObject o = summary(acct, f, m);
                          o.put("text", plain(b));
                          o.put("html", b.html == null ? JSONObject.NULL : b.html);
                          o.put("cc", addrs(m.getRecipients(javax.mail.Message.RecipientType.CC)));
                          o.put("replyTo", addrs(m.getReplyTo()));
                          o.put("messageId", header(m, "Message-ID"));
                          o.put("references", header(m, "References"));
                          o.put("unsub", header(m, "List-Unsubscribe"));
                          JSONArray at = new JSONArray();
                          for (int i = 0; i < b.atts.size(); i++) {
                              Part p = b.atts.get(i);
                              JSONObject x = new JSONObject();
                              String fn = null;
                              try { fn = p.getFileName(); } catch (Exception ignored) { }
                              x.put("idx", i);
                              x.put("name", fn == null ? "attachment-" + (i + 1) : fn);
                              x.put("size", Math.max(0, p.getSize()));
                              at.put(x);
                          }
                          o.put("attachments", at);
                          return o;
                      }
                      case "attachment": {
                          if (Build.VERSION.SDK_INT < 29) throw new Exception("Saving attachments needs Android 10 or newer");
                          IMAPFolder f = folder(acct, a.getString("folder"));
                          javax.mail.Message m = byUid(f, a.getLong("uid"));
                          ((IMAPMessage) m).setPeek(true);
                          Body b = new Body();
                          walk(m, b);
                          Part p = b.atts.get(a.getInt("idx"));
                          String name = p.getFileName() == null ? "attachment" : p.getFileName();
                          String mime = p.getContentType() == null ? "application/octet-stream" : p.getContentType().split(";")[0].trim().toLowerCase();
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          cv.put(MediaStore.Downloads.MIME_TYPE, mime);
                          cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Brisk");
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          if (uri == null) throw new Exception("Couldn't save to Downloads");
                          try (OutputStream out = getContentResolver().openOutputStream(uri); InputStream in = p.getInputStream()) {
                              byte[] buf = new byte[16384];
                              int n;
                              while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                          }
                          final Uri fu = uri;
                          final String fm = mime;
                          runOnUiThread(() -> {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW).setDataAndType(fu, fm)
                                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK));
                              } catch (Exception ignored) { }
                          });
                          JSONObject o = new JSONObject();
                          o.put("saved", "Downloads/Brisk/" + name);
                          return o;
                      }
                      case "search": {
                          IMAPFolder f = folder(acct, a.getString("folder"));
                          int max = a.optInt("count", 60);
                          javax.mail.Message[] found;
                          int total;
                          if (acct.gmail()) {
                              final String q = a.getString("query");
                              @SuppressWarnings("unchecked")
                              List<Long> uids = (List<Long>) f.doCommand(pr -> {
                                  Argument args = new Argument();
                                  args.writeAtom("X-GM-RAW");
                                  args.writeString(q);
                                  Response[] rs = pr.command("UID SEARCH", args);
                                  List<Long> list = new ArrayList<>();
                                  for (Response r : rs) {
                                      if (r instanceof IMAPResponse && ((IMAPResponse) r).keyEquals("SEARCH")) {
                                          long n;
                                          while ((n = r.readNumber()) != -1) list.add(n);
                                      }
                                  }
                                  pr.notifyResponseHandlers(rs);
                                  pr.handleResult(rs[rs.length - 1]);
                                  return list;
                              });
                              total = uids.size();
                              int from = Math.max(0, uids.size() - max);
                              long[] u = new long[uids.size() - from];
                              for (int i = 0; i < u.length; i++) u[i] = uids.get(from + i);
                              found = u.length > 0 ? f.getMessagesByUID(u) : new javax.mail.Message[0];
                          } else {
                              JSONArray terms = a.optJSONArray("terms");
                              SearchTerm st = null;
                              if (terms != null) {
                                  for (int i = 0; i < terms.length(); i++) {
                                      String t = terms.getString(i);
                                      SearchTerm one = new OrTerm(new SearchTerm[]{new SubjectTerm(t), new FromStringTerm(t), new BodyTerm(t)});
                                      st = st == null ? one : new AndTerm(st, one);
                                  }
                              }
                              javax.mail.Message[] all = st == null ? new javax.mail.Message[0] : f.search(st);
                              total = all.length;
                              found = Arrays.copyOfRange(all, Math.max(0, all.length - max), all.length);
                          }
                          JSONObject o = new JSONObject();
                          o.put("total", total);
                          o.put("items", found.length > 0 ? summaries(acct, f, found) : new JSONArray());
                          return o;
                      }
                      case "act": {
                          IMAPFolder f = folder(acct, a.getString("folder"));
                          javax.mail.Message[] ms = f.getMessagesByUID(longs(a.getJSONArray("uids")));
                          List<javax.mail.Message> ok = new ArrayList<>(Arrays.asList(ms));
                          ok.removeIf(x -> x == null);
                          javax.mail.Message[] arr = ok.toArray(new javax.mail.Message[0]);
                          if (arr.length == 0) return new JSONObject();
                          String op = a.getString("op");
                          switch (op) {
                              case "read": f.setFlags(arr, new Flags(Flags.Flag.SEEN), true); break;
                              case "unread": f.setFlags(arr, new Flags(Flags.Flag.SEEN), false); break;
                              case "star": f.setFlags(arr, new Flags(Flags.Flag.FLAGGED), true); break;
                              case "unstar": f.setFlags(arr, new Flags(Flags.Flag.FLAGGED), false); break;
                              case "move": {
                                  IMAPFolder to = (IMAPFolder) store(acct).getFolder(a.getString("to"));
                                  if (!to.exists()) to.create(Folder.HOLDS_MESSAGES);
                                  if (store(acct).hasCapability("MOVE")) {
                                      f.moveMessages(arr, to);
                                  } else {
                                      f.copyMessages(arr, to);
                                      f.setFlags(arr, new Flags(Flags.Flag.DELETED), true);
                                      try { f.expunge(arr); } catch (Exception e) { f.expunge(); }
                                  }
                                  break;
                              }
                              default: throw new Exception("Unknown action " + op);
                          }
                          return new JSONObject();
                      }
                      default:
                          throw new Exception("Unknown method " + method);
                  }
              }

              private Object send(JSONObject a) throws Exception {
                  Acct acct = acct(a);
                  Properties pr = new Properties();
                  pr.put("mail.smtp.host", acct.smtpHost);
                  pr.put("mail.smtp.port", String.valueOf(acct.smtpPort));
                  pr.put("mail.smtp.auth", "true");
                  if ("starttls".equals(acct.smtpSec)) {
                      pr.put("mail.smtp.starttls.enable", "true");
                      pr.put("mail.smtp.starttls.required", "true");
                  } else {
                      pr.put("mail.smtp.ssl.enable", "true");
                  }
                  pr.put("mail.smtp.connectiontimeout", "15000");
                  pr.put("mail.smtp.timeout", "60000");
                  Session s = Session.getInstance(pr);
                  MimeMessage mm = new MimeMessage(s);
                  String name = a.optString("name", "");
                  mm.setFrom(name.isEmpty() ? new InternetAddress(acct.email) : new InternetAddress(acct.email, name, "UTF-8"));
                  mm.setRecipients(javax.mail.Message.RecipientType.TO, InternetAddress.parse(a.getString("to")));
                  String cc = a.optString("cc", "").trim();
                  if (!cc.isEmpty()) mm.setRecipients(javax.mail.Message.RecipientType.CC, InternetAddress.parse(cc));
                  mm.setSubject(a.optString("subject", ""), "UTF-8");
                  String inReply = a.optString("inReplyTo", "");
                  if (!inReply.isEmpty()) {
                      mm.setHeader("In-Reply-To", inReply);
                      String refs = a.optString("references", "").trim();
                      mm.setHeader("References", (refs.isEmpty() ? "" : refs + " ") + inReply);
                  }
                  JSONArray atts = a.optJSONArray("attachments");
                  if (atts != null && atts.length() > 0) {
                      MimeMultipart mp = new MimeMultipart();
                      MimeBodyPart tp = new MimeBodyPart();
                      tp.setText(a.optString("body", ""), "UTF-8");
                      mp.addBodyPart(tp);
                      for (int i = 0; i < atts.length(); i++) {
                          JSONObject x = atts.getJSONObject(i);
                          byte[] bytes = Base64.decode(x.getString("b64"), Base64.DEFAULT);
                          MimeBodyPart ap = new MimeBodyPart();
                          ap.setDataHandler(new DataHandler(new ByteArrayDataSource(bytes, x.optString("mime", "application/octet-stream"))));
                          ap.setFileName(x.optString("name", "file"));
                          mp.addBodyPart(ap);
                      }
                      mm.setContent(mp);
                  } else {
                      mm.setText(a.optString("body", ""), "UTF-8");
                  }
                  mm.setSentDate(new java.util.Date());
                  mm.saveChanges();
                  Transport.send(mm, acct.user, acct.pw);

                  // Gmail files sent mail itself; other providers need a copy put in their Sent folder.
                  if (!acct.gmail()) {
                      String sent = a.optString("sentFolder", "");
                      if (!sent.isEmpty()) {
                          try {
                              synchronized (acct) {
                                  IMAPFolder f = (IMAPFolder) store(acct).getFolder(sent);
                                  if (!f.exists()) f.create(Folder.HOLDS_MESSAGES);
                                  mm.setFlag(Flags.Flag.SEEN, true);
                                  f.appendMessages(new javax.mail.Message[]{mm});
                              }
                          } catch (Exception ignored) { }
                      }
                  }
                  return new JSONObject();
              }

              private void reply(int id, boolean ok, String json) {
                  web.post(() -> web.evaluateJavascript("window.__brisk(" + id + "," + ok + "," + json + ")", null));
              }

              private static String friendly(Exception e) {
                  String m = e.getMessage();
                  if (e instanceof java.net.UnknownHostException || (m != null && m.contains("Couldn't connect")))
                      return "Couldn't reach the mail server. Check your internet and the server name.";
                  return m == null ? e.getClass().getSimpleName() : m;
              }

              private class Bridge {
                  @JavascriptInterface
                  public void call(int id, String method, String json) {
                      ExecutorService pool = "send".equals(method) ? smtpPool : imapPool;
                      pool.execute(() -> {
                          try {
                              JSONObject args = json == null || json.isEmpty() ? new JSONObject() : new JSONObject(json);
                              Object r = "send".equals(method) ? send(args) : run(method, args);
                              reply(id, true, r.toString());
                          } catch (Exception e) {
                              reply(id, false, JSONObject.quote(friendly(e)));
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openUrl(String url) {
                      runOnUiThread(() -> openExternal(url));
                  }

                  @JavascriptInterface
                  public String version() {
                      try {
                          return getPackageManager().getPackageInfo(getPackageName(), 0).versionName;
                      } catch (Exception e) {
                          return "";
                      }
                  }
              }
          }
