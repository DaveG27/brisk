          mkdir -p android/app/src/main/java/com/daveg27/brisk
          cat > android/app/src/main/java/com/daveg27/brisk/Acct.java <<'BRISK_EOF'
          package com.daveg27.brisk;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.util.Base64;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.nio.charset.StandardCharsets;
          import java.security.KeyStore;
          import java.util.ArrayList;
          import java.util.Collection;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.UUID;

          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;

          import com.sun.mail.imap.IMAPFolder;
          import com.sun.mail.imap.IMAPStore;

          /** One mail account, its saved settings and (while in use) its live IMAP connection. */
          class Acct {
              String id, email, user, provider, imapHost, smtpHost, smtpSec, pw;
              int imapPort, smtpPort;
              IMAPStore store;
              final Map<String, IMAPFolder> open = new HashMap<>();

              boolean gmail() { return "imap.gmail.com".equalsIgnoreCase(imapHost); }

              JSONObject pub() throws Exception {
                  JSONObject o = new JSONObject();
                  o.put("id", id); o.put("email", email); o.put("provider", provider); o.put("gmail", gmail());
                  return o;
              }

              /* ---------- storage ---------- */

              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences("brisk", Context.MODE_PRIVATE);
              }

              static JSONArray arr(Context c, String k) {
                  try { return new JSONArray(prefs(c).getString(k, "[]")); } catch (Exception e) { return new JSONArray(); }
              }

              static JSONObject obj(Context c, String k) {
                  try { return new JSONObject(prefs(c).getString(k, "{}")); } catch (Exception e) { return new JSONObject(); }
              }

              static synchronized void put(Context c, String k, Object v) {
                  prefs(c).edit().putString(k, v.toString()).apply();
              }

              private static SecretKey key() throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (!ks.containsAlias("brisk")) {
                      KeyGenerator kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                      kg.init(new KeyGenParameterSpec.Builder("brisk",
                              KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                              .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                              .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                              .build());
                      kg.generateKey();
                  }
                  return (SecretKey) ks.getKey("brisk", null);
              }

              static String enc(String plain) throws Exception {
                  Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
                  c.init(Cipher.ENCRYPT_MODE, key());
                  byte[] ct = c.doFinal(plain.getBytes(StandardCharsets.UTF_8));
                  return Base64.encodeToString(c.getIV(), Base64.NO_WRAP) + ":" + Base64.encodeToString(ct, Base64.NO_WRAP);
              }

              static String dec(String blob) throws Exception {
                  String[] parts = blob.split(":");
                  Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
                  c.init(Cipher.DECRYPT_MODE, key(), new GCMParameterSpec(128, Base64.decode(parts[0], Base64.NO_WRAP)));
                  return new String(c.doFinal(Base64.decode(parts[1], Base64.NO_WRAP)), StandardCharsets.UTF_8);
              }

              static synchronized void saveAll(Context ctx, Collection<Acct> list) throws Exception {
                  JSONArray arr = new JSONArray();
                  SharedPreferences.Editor ed = prefs(ctx).edit();
                  for (Acct a : list) {
                      JSONObject o = new JSONObject();
                      o.put("id", a.id); o.put("email", a.email); o.put("user", a.user); o.put("provider", a.provider);
                      o.put("imapHost", a.imapHost); o.put("imapPort", a.imapPort);
                      o.put("smtpHost", a.smtpHost); o.put("smtpPort", a.smtpPort); o.put("smtpSec", a.smtpSec);
                      arr.put(o);
                      ed.putString("pw_" + a.id, enc(a.pw));
                  }
                  ed.putString("accounts", arr.toString()).apply();
              }

              static synchronized List<Acct> loadAll(Context ctx) {
                  List<Acct> out = new ArrayList<>();
                  SharedPreferences p = prefs(ctx);
                  try {
                      String old = p.getString("email", null), oldPw = p.getString("pw", null);
                      if (old != null && oldPw != null && p.getString("accounts", null) == null) {
                          // Version 1 stored a single Gmail account: move it into the account list.
                          Acct a = gmail(old, dec(oldPw));
                          out.add(a);
                          saveAll(ctx, out);
                          p.edit().remove("email").remove("pw").apply();
                          return out;
                      }
                      JSONArray arr = new JSONArray(p.getString("accounts", "[]"));
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          Acct a = new Acct();
                          a.id = o.getString("id"); a.email = o.getString("email"); a.user = o.optString("user", a.email);
                          a.provider = o.optString("provider", "other");
                          a.imapHost = o.getString("imapHost"); a.imapPort = o.optInt("imapPort", 993);
                          a.smtpHost = o.getString("smtpHost"); a.smtpPort = o.optInt("smtpPort", 465);
                          a.smtpSec = o.optString("smtpSec", "ssl");
                          String blob = p.getString("pw_" + a.id, null);
                          if (blob == null) continue;
                          try { a.pw = dec(blob); } catch (Exception e) { continue; }
                          out.add(a);
                      }
                  } catch (Exception ignored) { }
                  return out;
              }

              static Acct gmail(String email, String pw) {
                  Acct a = new Acct();
                  a.id = UUID.randomUUID().toString().substring(0, 8);
                  a.email = email; a.user = email; a.pw = pw; a.provider = "gmail";
                  a.imapHost = "imap.gmail.com"; a.imapPort = 993;
                  a.smtpHost = "smtp.gmail.com"; a.smtpPort = 465; a.smtpSec = "ssl";
                  return a;
              }
          }
          BRISK_EOF
          mkdir -p android/app/src/main/java/com/daveg27/brisk
          cat > android/app/src/main/java/com/daveg27/brisk/BriskWidget.java <<'BRISK_EOF'
          package com.daveg27.brisk;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.view.View;
          import android.widget.RemoteViews;

          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Home-screen widget: unread count plus the latest emails across all accounts. */
          public class BriskWidget extends AppWidgetProvider {

              private static final int[] FROM = {R.id.w_f1, R.id.w_f2, R.id.w_f3, R.id.w_f4};
              private static final int[] SUBJ = {R.id.w_s1, R.id.w_s2, R.id.w_s3, R.id.w_s4};
              private static final int[] ROW = {R.id.w_r1, R.id.w_r2, R.id.w_r3, R.id.w_r4};

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) render(c, m, id);
                  CheckJob.schedule(c);
              }

              static void updateAll(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  for (int id : m.getAppWidgetIds(new ComponentName(c, BriskWidget.class))) render(c, m, id);
              }

              static void render(Context c, AppWidgetManager m, int id) {
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.brisk_widget);
                  Intent open = new Intent(c, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  v.setOnClickPendingIntent(R.id.w_root, PendingIntent.getActivity(c, 0, open,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT));
                  Intent compose = new Intent(c, MainActivity.class).putExtra("compose", true)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  v.setOnClickPendingIntent(R.id.w_compose, PendingIntent.getActivity(c, 1, compose,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT));
                  JSONObject d = Acct.obj(c, "widget");
                  int unread = d.optInt("unread", 0);
                  v.setTextViewText(R.id.w_count, unread == 0 ? "All read" : unread + " unread");
                  JSONArray items = d.optJSONArray("items");
                  int n = items == null ? 0 : items.length();
                  for (int i = 0; i < FROM.length; i++) {
                      if (i < n) {
                          JSONObject x = items.optJSONObject(i);
                          v.setViewVisibility(ROW[i], View.VISIBLE);
                          v.setTextViewText(FROM[i], (x.optBoolean("seen") ? "" : "● ") + x.optString("from"));
                          v.setTextViewText(SUBJ[i], x.optString("subj"));
                      } else {
                          v.setViewVisibility(ROW[i], View.GONE);
                      }
                  }
