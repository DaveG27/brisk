          import javax.activation.DataHandler;
          import javax.mail.Address;
          import javax.mail.FetchProfile;
          import javax.mail.Flags;
          import javax.mail.Folder;
          import javax.mail.Message;
          import javax.mail.Multipart;
          import javax.mail.Part;
          import javax.mail.Session;
          import javax.mail.Transport;
          import javax.mail.UIDFolder;
          import javax.mail.internet.InternetAddress;
          import javax.mail.internet.MimeBodyPart;
          import javax.mail.internet.MimeMessage;
          import javax.mail.internet.MimeMultipart;
          import javax.mail.search.HeaderTerm;
          import javax.mail.util.ByteArrayDataSource;

          import com.sun.mail.imap.IMAPFolder;
          import com.sun.mail.imap.IMAPMessage;
          import com.sun.mail.imap.IMAPStore;

          /** IMAP/SMTP helpers shared by the app, the background job and notification buttons. */
          final class Mail {
              private Mail() { }

              static final String SNOOZE_FOLDER = "Brisk Snoozed";

              /* ---------------- connections ---------------- */

              static IMAPStore connect(Acct a) throws Exception {
                  Properties pr = new Properties();
                  pr.put("mail.store.protocol", "imaps");
                  pr.put("mail.imaps.host", a.imapHost);
                  pr.put("mail.imaps.port", String.valueOf(a.imapPort));
                  pr.put("mail.imaps.connectiontimeout", "15000");
                  pr.put("mail.imaps.timeout", "30000");
                  pr.put("mail.imaps.partialfetch", "false");
                  Session s = Session.getInstance(pr);
                  IMAPStore st = (IMAPStore) s.getStore("imaps");
                  st.connect(a.imapHost, a.imapPort, a.user, a.pw);
                  return st;
              }

              static IMAPStore store(Acct a) throws Exception {
                  if (a.store != null && a.store.isConnected()) return a.store;
                  closeAll(a);
                  a.store = connect(a);
                  return a.store;
              }

              static IMAPFolder folder(Acct a, String path) throws Exception {
                  IMAPFolder f = a.open.get(path);
                  if (f != null && f.isOpen()) return f;
                  f = (IMAPFolder) store(a).getFolder(path);
                  f.open(Folder.READ_WRITE);
                  a.open.put(path, f);
                  return f;
              }

              static boolean exists(Acct a, String path) throws Exception {
                  return store(a).getFolder(path).exists();
              }

              static void closeAll(Acct a) {
                  for (IMAPFolder f : a.open.values()) {
                      try { if (f.isOpen()) f.close(false); } catch (Exception ignored) { }
                  }
                  a.open.clear();
                  try { if (a.store != null) a.store.close(); } catch (Exception ignored) { }
                  a.store = null;
              }

              /* ---------------- messages ---------------- */

              static String addrs(Address[] a) {
                  if (a == null) return "";
                  StringBuilder sb = new StringBuilder();
                  for (Address x : a) {
                      if (sb.length() > 0) sb.append(", ");
                      sb.append(x instanceof InternetAddress ? ((InternetAddress) x).toUnicodeString() : x.toString());
                  }
                  return sb.toString();
              }

              static JSONObject summary(Acct acct, IMAPFolder f, Message m) throws Exception {
                  JSONObject o = new JSONObject();
                  o.put("acct", acct.id);
                  o.put("uid", f.getUID(m));
                  o.put("folder", f.getFullName());
                  Address[] fr = m.getFrom();
                  InternetAddress a = fr != null && fr.length > 0 && fr[0] instanceof InternetAddress ? (InternetAddress) fr[0] : null;
                  String name = a == null ? "(unknown)" : (a.getPersonal() != null && !a.getPersonal().trim().isEmpty() ? a.getPersonal() : a.getAddress());
                  o.put("from", name);
                  o.put("email", a == null || a.getAddress() == null ? "" : a.getAddress());
                  o.put("to", addrs(m.getRecipients(Message.RecipientType.TO)));
                  String subj = m.getSubject();
                  o.put("subj", subj == null || subj.trim().isEmpty() ? "(no subject)" : subj);
                  java.util.Date d = m.getReceivedDate();
                  if (d == null) d = m.getSentDate();
                  o.put("t", d == null ? 0 : d.getTime());
                  o.put("seen", m.isSet(Flags.Flag.SEEN));
                  o.put("star", m.isSet(Flags.Flag.FLAGGED));
                  String ct = m.getContentType();
                  o.put("att", ct != null && ct.toLowerCase().startsWith("multipart/mixed"));
                  String mid = m instanceof MimeMessage ? ((MimeMessage) m).getMessageID() : null;
                  o.put("mid", mid == null ? "" : mid);
                  return o;
              }

              static FetchProfile listProfile() {
                  FetchProfile fp = new FetchProfile();
                  fp.add(FetchProfile.Item.ENVELOPE);
                  fp.add(FetchProfile.Item.FLAGS);
                  fp.add(FetchProfile.Item.CONTENT_INFO);
                  fp.add(UIDFolder.FetchProfileItem.UID);
                  return fp;
              }

              static Message[] nonNull(Message[] ms) {
                  List<Message> ok = new ArrayList<>();
                  for (Message m : ms) if (m != null) ok.add(m);
                  return ok.toArray(new Message[0]);
              }

              static JSONArray summaries(Acct a, IMAPFolder f, Message[] ms) throws Exception {
                  Message[] arr = nonNull(ms);
                  f.fetch(arr, listProfile());
                  JSONArray items = new JSONArray();
                  for (int i = arr.length - 1; i >= 0; i--) {
                      try { items.put(summary(a, f, arr[i])); } catch (Exception ignored) { }
                  }
                  return items;
              }

              static class Body {
                  String text, html;
                  final List<Part> atts = new ArrayList<>();
              }

              static String str(Object c) throws Exception {
                  if (c instanceof String) return (String) c;
                  if (c instanceof InputStream) return new String(readAll((InputStream) c), StandardCharsets.UTF_8);
                  return c == null ? "" : c.toString();
              }

              static byte[] readAll(InputStream in) throws Exception {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[16384];
                  int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  in.close();
                  return bo.toByteArray();
              }

              static void walk(Part p, Body b) throws Exception {
                  String disp = p.getDisposition(), fn = null;
                  try { fn = p.getFileName(); } catch (Exception ignored) { }
                  if (p.isMimeType("multipart/*")) {
                      Multipart mp = (Multipart) p.getContent();
                      for (int i = 0; i < mp.getCount(); i++) walk(mp.getBodyPart(i), b);
                  } else if (p.isMimeType("message/rfc822")) {
                      Object c = p.getContent();
                      if (c instanceof Part) walk((Part) c, b);
                  } else if (Part.ATTACHMENT.equalsIgnoreCase(disp) || (fn != null && !p.isMimeType("text/*"))) {
                      b.atts.add(p);
                  } else if (p.isMimeType("text/plain")) {
                      if (b.text == null) b.text = str(p.getContent());
                  } else if (p.isMimeType("text/html")) {
                      if (b.html == null) b.html = str(p.getContent());
                  } else if (fn != null) {
                      b.atts.add(p);
                  }
              }

              static String plain(Body b) {
                  if (b.text != null && !b.text.trim().isEmpty()) return b.text;
                  if (b.html == null) return "";
                  String h = b.html.replaceAll("(?is)<(style|script|head)[^>]*>.*?</\\1>", " ")
                          .replaceAll("(?i)<br\\s*/?>|</p>|</div>|</tr>|</h[1-6]>", "\n")
                          .replaceAll("<[^>]+>", " ")
                          .replace("&nbsp;", " ").replace("&amp;", "&").replace("&lt;", "<")
                          .replace("&gt;", ">").replace("&quot;", "\"").replace("&#39;", "'").replace("&pound;", "£");
                  return h.replaceAll("[ \\t\\x0B\\f\\r]+", " ").replaceAll("\\n\\s*\\n+", "\n\n").trim();
              }

              static String snippet(Message m) {
                  try {
                      ((IMAPMessage) m).setPeek(true);
                      Body b = new Body();
                      walk(m, b);
                      String t = plain(b).replaceAll("\\s+", " ").trim();
                      return t.length() > 600 ? t.substring(0, 600) : t;
                  } catch (Exception e) {
                      return "";
                  }
              }

              static String header(Message m, String name) throws Exception {
                  String[] h = m.getHeader(name);
                  return h == null || h.length == 0 ? "" : h[0];
              }

              static Message byUid(IMAPFolder f, long uid) throws Exception {
                  Message m = f.getMessageByUID(uid);
                  if (m == null) throw new Exception("That email no longer exists");
                  return m;
              }

              static long[] longs(JSONArray a) throws Exception {
                  long[] u = new long[a.length()];
                  for (int i = 0; i < u.length; i++) u[i] = a.getLong(i);
                  return u;
              }

              /* ---------------- folders ---------------- */

              static String roleByName(String name) {
                  String n = name.toLowerCase().trim();
                  switch (n) {
                      case "archive": case "archives": return "archive";
                      case "sent": case "sent items": case "sent messages": case "sent mail": return "sent";
                      case "trash": case "deleted": case "deleted items": case "deleted messages": case "bin": return "trash";
                      case "spam": case "junk": case "junk e-mail": case "junk email": case "bulk mail": case "bulk": return "spam";
                      case "drafts": case "draft": return "drafts";
                      default: return null;
                  }
              }

              static JSONObject folders(Acct acct) throws Exception {
                  JSONObject sp = new JSONObject();
                  JSONArray labels = new JSONArray();
                  sp.put("inbox", "INBOX");
                  Map<String, String> byName = new HashMap<>();
                  for (Folder f : store(acct).getDefaultFolder().list("*")) {
                      String[] attrs = ((IMAPFolder) f).getAttributes();
                      String role = null;
                      boolean noSelect = false;
                      for (String at : attrs) {
                          switch (at) {
                              case "\\All": role = "all"; break;
                              case "\\Archive": role = "archive"; break;
                              case "\\Sent": role = "sent"; break;
                              case "\\Trash": role = "trash"; break;
                              case "\\Drafts": role = "drafts"; break;
                              case "\\Junk": role = "spam"; break;
                              case "\\Flagged": role = "starred"; break;
                              case "\\Important": role = "important"; break;
                              case "\\Noselect": case "\\NonExistent": noSelect = true; break;
                              default: break;
                          }
                      }
                      if (noSelect) continue;
                      String full = f.getFullName();
                      if (SNOOZE_FOLDER.equals(full)) { sp.put("snoozed", full); continue; }
                      if (role != null) sp.put(role, full);
                      else if (!"INBOX".equalsIgnoreCase(full)) {
                          String r = roleByName(f.getName());
                          if (r != null && !byName.containsKey(r)) byName.put(r, full);
                          else labels.put(full);
                      }
                  }
                  for (Map.Entry<String, String> e : byName.entrySet()) {
                      if (!sp.has(e.getKey())) sp.put(e.getKey(), e.getValue());
                      else labels.put(e.getValue());
                  }
                  JSONObject o = new JSONObject();
                  o.put("special", sp);
                  o.put("labels", labels);
                  return o;
              }

              static String special(Acct a, String role, String fallback) {
                  try {
                      JSONObject sp = folders(a).getJSONObject("special");
                      if ("archive".equals(role) && a.gmail()) return sp.optString("all", fallback);
                      return sp.optString(role, fallback);
                  } catch (Exception e) {
                      return fallback;
                  }
              }

              static void move(Acct acct, IMAPFolder f, Message[] arr, String dest) throws Exception {
                  IMAPFolder to = (IMAPFolder) store(acct).getFolder(dest);
                  if (!to.exists()) to.create(Folder.HOLDS_MESSAGES);
                  if (store(acct).hasCapability("MOVE")) {
                      f.moveMessages(arr, to);
                  } else {
                      f.copyMessages(arr, to);
                      f.setFlags(arr, new Flags(Flags.Flag.DELETED), true);
                      expunge(f, arr);
                  }
              }

              static void expunge(IMAPFolder f, Message[] arr) throws Exception {
                  try { f.expunge(arr); } catch (Exception e) { f.expunge(); }
              }

              static void deleteForever(IMAPFolder f, Message[] arr) throws Exception {
                  f.setFlags(arr, new Flags(Flags.Flag.DELETED), true);
                  expunge(f, arr);
              }

              /* ---------------- building and sending ---------------- */

              static Session smtpSession(Acct acct) {
                  Properties pr = new Properties();
                  pr.put("mail.smtp.host", acct.smtpHost);
                  pr.put("mail.smtp.port", String.valueOf(acct.smtpPort));
                  pr.put("mail.smtp.auth", "true");
                  if ("starttls".equals(acct.smtpSec)) {
                      pr.put("mail.smtp.starttls.enable", "true");
                      pr.put("mail.smtp.starttls.required", "true");
                  } else {
                      pr.put("mail.smtp.ssl.enable", "true");
                  }
                  pr.put("mail.smtp.connectiontimeout", "15000");
                  pr.put("mail.smtp.timeout", "60000");
                  return Session.getInstance(pr);
              }

              static MimeMessage build(Session s, Acct acct, JSONObject a) throws Exception {
                  MimeMessage mm = new MimeMessage(s);
                  String name = a.optString("name", "");
                  mm.setFrom(name.isEmpty() ? new InternetAddress(acct.email) : new InternetAddress(acct.email, name, "UTF-8"));
                  String to = a.optString("to", "").trim();
                  if (!to.isEmpty()) mm.setRecipients(Message.RecipientType.TO, InternetAddress.parse(to));
                  String cc = a.optString("cc", "").trim();
                  if (!cc.isEmpty()) mm.setRecipients(Message.RecipientType.CC, InternetAddress.parse(cc));
                  mm.setSubject(a.optString("subject", ""), "UTF-8");
                  String inReply = a.optString("inReplyTo", "");
                  if (!inReply.isEmpty()) {
                      mm.setHeader("In-Reply-To", inReply);
                      String refs = a.optString("references", "").trim();
                      mm.setHeader("References", (refs.isEmpty() ? "" : refs + " ") + inReply);
                  }
                  JSONArray atts = a.optJSONArray("attachments");
                  if (atts != null && atts.length() > 0) {
                      MimeMultipart mp = new MimeMultipart();
                      MimeBodyPart tp = new MimeBodyPart();
                      tp.setText(a.optString("body", ""), "UTF-8");
                      mp.addBodyPart(tp);
                      for (int i = 0; i < atts.length(); i++) {
                          JSONObject x = atts.getJSONObject(i);
                          byte[] bytes = Base64.decode(x.getString("b64"), Base64.DEFAULT);
                          MimeBodyPart ap = new MimeBodyPart();
                          ap.setDataHandler(new DataHandler(new ByteArrayDataSource(bytes, x.optString("mime", "application/octet-stream"))));
                          ap.setFileName(x.optString("name", "file"));
                          mp.addBodyPart(ap);
                      }
                      mm.setContent(mp);
                  } else {
                      mm.setText(a.optString("body", ""), "UTF-8");
                  }
                  mm.setSentDate(new java.util.Date());
                  return mm;
              }

              /** Sends, files a copy in Sent (non-Gmail) and removes the matching server draft. */
              static void send(Acct acct, JSONObject a) throws Exception {
                  MimeMessage mm = build(smtpSession(acct), acct, a);
                  mm.saveChanges();
                  Transport.send(mm, acct.user, acct.pw);
                  synchronized (acct) {
                      if (!acct.gmail()) {
                          String sent = a.optString("sentFolder", "");
                          if (sent.isEmpty()) sent = special(acct, "sent", "Sent");
                          try {
                              IMAPFolder f = (IMAPFolder) store(acct).getFolder(sent);
                              if (!f.exists()) f.create(Folder.HOLDS_MESSAGES);
                              mm.setFlag(Flags.Flag.SEEN, true);
                              f.appendMessages(new Message[]{mm});
                          } catch (Exception ignored) { }
                      }
                      String dk = a.optString("draftKey", ""), df = a.optString("draftsFolder", "");
                      if (!dk.isEmpty() && !df.isEmpty()) {
                          try { deleteDraft(acct, df, dk); } catch (Exception ignored) { }
                      }
                  }
              }

              static void saveDraft(Acct acct, JSONObject a) throws Exception {
                  String folder = a.getString("folder"), dk = a.getString("draftKey");
                  MimeMessage mm = build(Session.getInstance(new Properties()), acct, a);
                  mm.setHeader("X-Brisk-Draft", dk);
                  mm.setFlag(Flags.Flag.DRAFT, true);
                  mm.setFlag(Flags.Flag.SEEN, true);
                  mm.saveChanges();
                  IMAPFolder f = (IMAPFolder) store(acct).getFolder(folder);
                  if (!f.exists()) f.create(Folder.HOLDS_MESSAGES);
                  deleteDraft(acct, folder, dk);
                  f.appendMessages(new Message[]{mm});
              }

              static void deleteDraft(Acct acct, String folder, String dk) throws Exception {
                  if (!exists(acct, folder)) return;
                  IMAPFolder f = folder(acct, folder);
                  Message[] found = f.search(new HeaderTerm("X-Brisk-Draft", dk));
                  if (found.length > 0) deleteForever(f, found);
              }

              /* ---------------- unsubscribe ---------------- */

              private static String allHeaders(Message m, String name) throws Exception {
                  String[] h = m.getHeader(name);
                  if (h == null) return "";
                  StringBuilder sb = new StringBuilder();
                  for (String x : h) sb.append(x).append(',');
                  return sb.toString();
              }

              /**
               * Unsubscribes from the list that sent message m, the way Gmail does:
               * 1. RFC 8058 one-click (HTTP POST) when the sender supports it,
               * 2. otherwise an unsubscribe email to the list's mailto address,
               * 3. otherwise the web link from the header or the email's footer, for the user to finish in a browser.
               */
              static JSONObject unsubscribe(Acct acct, Message m) throws Exception {
                  JSONObject o = new JSONObject();
                  String lu = allHeaders(m, "List-Unsubscribe").replaceAll("\\s+", "");
                  boolean oneClick = allHeaders(m, "List-Unsubscribe-Post").toLowerCase().contains("one-click");
                  String web = null, mailto = null;
                  Matcher mw = Pattern.compile("<(https?:[^>]+)>", Pattern.CASE_INSENSITIVE).matcher(lu);
                  if (mw.find()) web = mw.group(1);
                  Matcher mm = Pattern.compile("<mailto:([^>]+)>", Pattern.CASE_INSENSITIVE).matcher(lu);
                  if (mm.find()) mailto = mm.group(1);

                  if (web != null && oneClick) {
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(web).openConnection();
                          c.setRequestMethod("POST");
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(20000);
                          c.setInstanceFollowRedirects(false);
                          c.setDoOutput(true);
                          c.setRequestProperty("Content-Type", "application/x-www-form-urlencoded");
                          c.setRequestProperty("User-Agent", "BriskMail/1.0 (Android)");
                          try (OutputStream out = c.getOutputStream()) {
                              out.write("List-Unsubscribe=One-Click".getBytes(StandardCharsets.UTF_8));
                          }
                          int code = c.getResponseCode();
                          c.disconnect();
                          if (code >= 200 && code < 400) {
                              o.put("method", "oneclick");
                              return o;
                          }
                      } catch (Exception ignored) { /* fall through to the next way */ }
                  }
                  if (mailto != null) {
                      String[] parts = mailto.split("\\?", 2);
                      String to = URLDecoder.decode(parts[0], "UTF-8"), subject = "unsubscribe", body = "unsubscribe";
                      if (parts.length > 1) {
                          for (String kv : parts[1].split("&")) {
                              String[] p = kv.split("=", 2);
                              if (p.length < 2) continue;
                              if ("subject".equalsIgnoreCase(p[0])) subject = URLDecoder.decode(p[1], "UTF-8");
                              if ("body".equalsIgnoreCase(p[0])) body = URLDecoder.decode(p[1], "UTF-8");
                          }
                      }
                      try {
                          JSONObject pl = new JSONObject();
                          pl.put("to", to); pl.put("subject", subject); pl.put("body", body);
                          send(acct, pl);
                          o.put("method", "email");
                          o.put("to", to);
                          return o;
                      } catch (Exception e) {
                          if (web == null) throw new Exception("Couldn't send the unsubscribe email: " + e.getMessage());
                      }
                  }
                  if (web == null) {
                      // No List-Unsubscribe header: look for an unsubscribe link in the email itself.
                      ((IMAPMessage) m).setPeek(true);
                      Body b = new Body();
                      walk(m, b);
                      String html = b.html == null ? "" : b.html;
                      Matcher a = Pattern.compile("<a\\b[^>]*href\\s*=\\s*[\"']?(https?://[^\"'\\s>]+)[^>]*>(.*?)</a>", Pattern.CASE_INSENSITIVE | Pattern.DOTALL).matcher(html);
                      String fallback = null;
                      while (a.find()) {
                          String href = a.group(1).replace("&amp;", "&"), text = a.group(2).replaceAll("<[^>]+>", " ");
                          if ((href + " " + text).toLowerCase().matches("(?s).*(unsubscri|opt[ -]?out).*")) { web = href; break; }
                          if (fallback == null && text.toLowerCase().matches("(?s).*(manage (your )?(email )?(preferences|subscriptions?)|email preferences).*")) fallback = href;
                      }
                      if (web == null) web = fallback;
                      if (web == null && b.text != null) {
                          Matcher t = Pattern.compile("(https?://\\S*unsubscri\\S*)", Pattern.CASE_INSENSITIVE).matcher(b.text);
                          if (t.find()) web = t.group(1);
                      }
                  }
                  if (web != null) {
                      o.put("method", "web");
                      o.put("url", web);
                      return o;
                  }
                  o.put("method", "none");
                  return o;
              }

              /* ---------------- snooze ---------------- */

              static void snooze(Context c, Acct acct, IMAPFolder f, Message[] arr, long until) throws Exception {
                  JSONArray list = Acct.arr(c, "snoozes");
                  for (Message m : arr) {
                      String mid = m instanceof MimeMessage ? ((MimeMessage) m).getMessageID() : null;
                      if (mid == null) continue;
                      JSONObject e = new JSONObject();
                      e.put("acct", acct.id); e.put("mid", mid); e.put("until", until);
                      e.put("subj", m.getSubject() == null ? "" : m.getSubject());
                      Address[] fr = m.getFrom();
                      e.put("from", fr != null && fr.length > 0 ? (fr[0] instanceof InternetAddress && ((InternetAddress) fr[0]).getPersonal() != null ? ((InternetAddress) fr[0]).getPersonal() : fr[0].toString()) : "");
                      list.put(e);
                  }
                  move(acct, f, arr, SNOOZE_FOLDER);
                  Acct.put(c, "snoozes", list);
              }

              /** Moves snoozed emails whose time has come (or all of `onlyMid` when given) back to the inbox, unread. Returns the woken entries. */
              static List<JSONObject> wake(Context c, Acct acct, String onlyMid, boolean force) throws Exception {
                  JSONArray list = Acct.arr(c, "snoozes"), keep = new JSONArray();
                  List<JSONObject> woken = new ArrayList<>();
                  long now = System.currentTimeMillis();
                  for (int i = 0; i < list.length(); i++) {
                      JSONObject e = list.getJSONObject(i);
                      boolean mine = acct.id.equals(e.optString("acct"));
                      boolean due = force || e.optLong("until") <= now;
                      if (onlyMid != null) due = onlyMid.equals(e.optString("mid"));
                      if (mine && due) woken.add(e); else keep.put(e);
                  }
                  if (woken.isEmpty()) return woken;
                  if (exists(acct, SNOOZE_FOLDER)) {
                      IMAPFolder f = folder(acct, SNOOZE_FOLDER);
                      for (JSONObject e : woken) {
                          Message[] found = f.search(new HeaderTerm("Message-ID", e.getString("mid")));
                          if (found.length == 0) continue;
                          f.setFlags(found, new Flags(Flags.Flag.SEEN), false);
                          move(acct, f, found, "INBOX");
                      }
                  }
                  // Re-read in case another thread added entries meanwhile.
                  JSONArray now2 = Acct.arr(c, "snoozes"), merged = new JSONArray();
                  for (int i = 0; i < now2.length(); i++) {
                      JSONObject e = now2.getJSONObject(i);
                      boolean gone = false;
                      for (JSONObject w : woken) if (w.optString("mid").equals(e.optString("mid")) && w.optString("acct").equals(e.optString("acct"))) gone = true;
                      if (!gone) merged.put(e);
                  }
                  Acct.put(c, "snoozes", merged);
                  return woken;
              }

              /* ---------------- send later ---------------- */

              static File outbox(Context c) {
                  File d = new File(c.getFilesDir(), "outbox");
                  if (!d.exists()) d.mkdirs();
                  return d;
              }

              static JSONObject schedule(Context c, JSONObject payload, long at) throws Exception {
                  String id = UUID.randomUUID().toString().substring(0, 10);
                  try (FileOutputStream o = new FileOutputStream(new File(outbox(c), id + ".json"))) {
                      o.write(payload.toString().getBytes(StandardCharsets.UTF_8));
                  }
                  JSONObject e = new JSONObject();
                  e.put("id", id); e.put("acct", payload.getString("acct")); e.put("at", at);
                  e.put("to", payload.optString("to")); e.put("subject", payload.optString("subject"));
                  JSONArray list = Acct.arr(c, "scheduled");
                  list.put(e);
                  Acct.put(c, "scheduled", list);
                  return e;
              }

              static JSONObject payload(Context c, String id) throws Exception {
                  File f = new File(outbox(c), id + ".json");
                  try (FileInputStream in = new FileInputStream(f)) {
                      return new JSONObject(new String(readAll(in), StandardCharsets.UTF_8));
                  }
              }

              static void unschedule(Context c, String id) {
                  JSONArray list = Acct.arr(c, "scheduled"), keep = new JSONArray();
                  for (int i = 0; i < list.length(); i++) {
                      JSONObject e = list.optJSONObject(i);
                      if (e != null && !id.equals(e.optString("id"))) keep.put(e);
                  }
                  Acct.put(c, "scheduled", keep);
                  new File(outbox(c), id + ".json").delete();
              }

              /** Earliest pending snooze or scheduled send, or 0. */
              static long nextDue(Context c) {
                  long best = 0;
                  for (String k : new String[]{"snoozes", "scheduled"}) {
                      JSONArray l = Acct.arr(c, k);
                      for (int i = 0; i < l.length(); i++) {
                          JSONObject e = l.optJSONObject(i);
                          if (e == null) continue;
                          long t = e.optLong("snoozes".equals(k) ? "until" : "at");
                          if (t > 0 && (best == 0 || t < best)) best = t;
                      }
                  }
                  return best;
              }
          }
