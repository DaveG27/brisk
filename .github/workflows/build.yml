          </vector>
          BRISK_EOF
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_mail.xml <<'BRISK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M3,5h18a1,1 0 0,1 1,1v12a1,1 0 0,1 -1,1h-18a1,1 0 0,1 -1,-1v-12a1,1 0 0,1 1,-1zM4,7.2v10.3h16v-10.3l-8,5.6z"/>
