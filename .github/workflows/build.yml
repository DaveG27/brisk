      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Brisk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Brisk-apk
          path: Brisk.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Brisk (latest build)
          body: |
            Build ${{ github.run_number }}. On your phone, download Brisk.apk below and open it to install or update.
          files: Brisk.apk
          make_latest: true
