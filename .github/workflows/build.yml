          package com.daveg27.brisk;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.job.JobInfo;
          import android.app.job.JobParameters;
          import android.app.job.JobScheduler;
          import android.app.job.JobService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.drawable.Icon;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          import javax.mail.Address;
          import javax.mail.Flags;
          import javax.mail.Message;
          import javax.mail.UIDFolder;
          import javax.mail.internet.InternetAddress;

          import com.sun.mail.imap.IMAPFolder;

          /**
           * Runs about every 15 minutes (and at snooze / send-later times): sends scheduled
           * emails, brings snoozed emails back, posts new-mail notifications and refreshes the widget.
           */
          public class CheckJob extends JobService {

              static final int PERIODIC = 7101, ONCE = 7102;
              static final String CHANNEL = "mail";

              static void schedule(Context c) {
                  JobScheduler js = c.getSystemService(JobScheduler.class);
                  if (js == null) return;
                  if (js.getPendingJob(PERIODIC) == null) {
                      js.schedule(new JobInfo.Builder(PERIODIC, new ComponentName(c, CheckJob.class))
                              .setPeriodic(15 * 60 * 1000L)
                              .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                              .setPersisted(true)
                              .build());
                  }
                  scheduleNext(c);
              }

              /** One-off run at the next snooze / scheduled-send time. */
              static void scheduleNext(Context c) {
                  JobScheduler js = c.getSystemService(JobScheduler.class);
                  if (js == null) return;
                  long due = Mail.nextDue(c);
                  if (due == 0) { js.cancel(ONCE); return; }
                  long delay = Math.max(0, due - System.currentTimeMillis());
                  js.schedule(new JobInfo.Builder(ONCE, new ComponentName(c, CheckJob.class))
                          .setMinimumLatency(delay)
                          .setOverrideDeadline(delay + 5 * 60 * 1000L)
                          .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                          .setPersisted(true)
                          .build());
              }

              @Override
              public boolean onStartJob(JobParameters params) {
                  final Context c = getApplicationContext();
                  new Thread(() -> {
                      try { work(c); } catch (Exception ignored) { }
                      finally {
                          scheduleNext(c);
                          jobFinished(params, false);
                      }
                  }).start();
                  return true;
              }

              @Override
              public boolean onStopJob(JobParameters params) {
                  return true;
              }

              static synchronized void work(Context c) {
                  List<Acct> accounts = Acct.loadAll(c);
                  JSONObject cfg = Acct.obj(c, "notify");
                  boolean notifyOn = cfg.optBoolean("enabled", true), vipOnly = cfg.optBoolean("vipOnly", false);
                  List<String> vips = new ArrayList<>();
                  JSONArray va = cfg.optJSONArray("vips");
                  if (va != null) for (int i = 0; i < va.length(); i++) vips.add(va.optString(i).toLowerCase());
                  long now = System.currentTimeMillis();

                  // 1. Scheduled sends that are due
                  JSONArray sched = Acct.arr(c, "scheduled");
                  for (int i = 0; i < sched.length(); i++) {
                      JSONObject e = sched.optJSONObject(i);
                      if (e == null || e.optLong("at") > now) continue;
                      Acct a = find(accounts, e.optString("acct"));
                      String id = e.optString("id");
                      try {
                          if (a == null) throw new Exception("account removed");
                          Mail.send(a, Mail.payload(c, id));
                          Mail.unschedule(c, id);
                      } catch (Exception ex) {
                          int tries = e.optInt("tries", 0) + 1;
                          if (tries >= 5 || a == null) {
                              Mail.unschedule(c, id);
                              post(c, ("sendfail" + id).hashCode(), "Scheduled email not sent", "“" + e.optString("subject") + "” couldn’t be sent: " + ex.getMessage(), null, null, 0);
                          } else {
                              try {
                                  JSONArray l = Acct.arr(c, "scheduled");
                                  for (int j = 0; j < l.length(); j++) {
                                      JSONObject x = l.getJSONObject(j);
                                      if (id.equals(x.optString("id"))) { x.put("tries", tries); x.put("at", now + 10 * 60 * 1000L); }
                                  }
                                  Acct.put(c, "scheduled", l);
                              } catch (Exception ignored) { }
                          }
                      }
                  }

                  JSONArray widgetItems = new JSONArray();
                  int unreadTotal = 0;
                  for (Acct a : accounts) {
                      try {
                          // 2. Snoozed emails that are due
                          for (JSONObject w : Mail.wake(c, a, null, false)) {
                              if (notifyOn) post(c, ("snz" + w.optString("mid")).hashCode(), "Back from snooze: " + w.optString("from"), w.optString("subj"), a, null, 0);
                          }
                          // 3. New mail
                          IMAPFolder inbox = Mail.folder(a, "INBOX");
                          long validity = inbox.getUIDValidity(), next = inbox.getUIDNext();
                          String kLast = "lastUid_" + a.id, kVal = "uidv_" + a.id;
                          long last = Acct.prefs(c).getLong(kLast, -1), oldVal = Acct.prefs(c).getLong(kVal, -1);
                          if (last < 0 || oldVal != validity) {
                              last = next - 1; // first run: start from now, don't notify old mail
                          } else if (next - 1 > last && notifyOn) {
                              Message[] ms = Mail.nonNull(inbox.getMessagesByUID(last + 1, UIDFolder.LASTUID));
                              inbox.fetch(ms, Mail.listProfile());
                              int shown = 0;
                              for (int i = ms.length - 1; i >= 0 && shown < 8; i--) {
                                  Message m = ms[i];
                                  long uid = inbox.getUID(m);
                                  if (uid <= last || m.isSet(Flags.Flag.SEEN)) continue;
                                  Address[] fr = m.getFrom();
                                  InternetAddress ia = fr != null && fr.length > 0 && fr[0] instanceof InternetAddress ? (InternetAddress) fr[0] : null;
                                  String email = ia == null || ia.getAddress() == null ? "" : ia.getAddress().toLowerCase();
                                  if (vipOnly && !vips.contains(email)) continue;
                                  String from = ia == null ? "New email" : (ia.getPersonal() != null ? ia.getPersonal() : ia.getAddress());
                                  String subj = m.getSubject() == null ? "(no subject)" : m.getSubject();
                                  String snip = Mail.snippet(m);
                                  post(c, (a.id + uid).hashCode(), (vips.contains(email) ? "★ " : "") + from, subj + (snip.isEmpty() ? "" : "\n" + snip), a, "INBOX", uid);
                                  shown++;
                              }
                          }
                          Acct.prefs(c).edit().putLong(kLast, Math.max(last, next - 1)).putLong(kVal, validity).apply();
                          // 4. Widget data
                          unreadTotal += Math.max(0, inbox.getUnreadMessageCount());
                          int total = inbox.getMessageCount();
                          if (total > 0) {
                              Message[] recent = inbox.getMessages(Math.max(1, total - 3), total);
                              inbox.fetch(recent, Mail.listProfile());
                              for (Message m : recent) {
                                  JSONObject o = Mail.summary(a, inbox, m);
                                  widgetItems.put(o);
                              }
                          }
                      } catch (Exception ignored) {
                      } finally {
                          Mail.closeAll(a);
                      }
                  }
                  try {
                      List<JSONObject> list = new ArrayList<>();
                      for (int i = 0; i < widgetItems.length(); i++) list.add(widgetItems.getJSONObject(i));
                      list.sort((x, y) -> Long.compare(y.optLong("t"), x.optLong("t")));
                      JSONArray top = new JSONArray();
                      for (int i = 0; i < Math.min(4, list.size()); i++) {
                          JSONObject x = list.get(i), w = new JSONObject();
                          w.put("from", x.optString("from")); w.put("subj", x.optString("subj")); w.put("seen", x.optBoolean("seen"));
                          top.put(w);
                      }
                      if (!accounts.isEmpty()) {
                          JSONObject wd = new JSONObject();
                          wd.put("unread", unreadTotal); wd.put("items", top); wd.put("t", now);
                          Acct.put(c, "widget", wd);
                          BriskWidget.updateAll(c);
                      }
                  } catch (Exception ignored) { }
              }

              static Acct find(List<Acct> l, String id) {
                  for (Acct a : l) if (a.id.equals(id)) return a;
                  return null;
              }

              static void channel(Context c) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm != null && nm.getNotificationChannel(CHANNEL) == null) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "New email", NotificationManager.IMPORTANCE_DEFAULT);
                      ch.setDescription("New emails, snoozed emails coming back, and send-later problems");
                      nm.createNotificationChannel(ch);
                  }
              }

              static PendingIntent action(Context c, int nid, Acct a, String folder, long uid, String op) {
                  Intent i = new Intent(c, NotifyAction.class)
                          .putExtra("acct", a.id).putExtra("folder", folder).putExtra("uid", uid)
                          .putExtra("op", op).putExtra("nid", nid);
                  return PendingIntent.getBroadcast(c, (nid + op).hashCode(), i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              static void post(Context c, int nid, String title, String text, Acct a, String folder, long uid) {
                  channel(c);
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null) return;
                  Intent open = new Intent(c, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  if (a != null && folder != null) {
                      open.putExtra("open", "{\"acct\":\"" + a.id + "\",\"folder\":" + JSONObject.quote(folder) + ",\"uid\":" + uid + "}");
                  }
                  PendingIntent pi = PendingIntent.getActivity(c, nid, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  String first = text.contains("\n") ? text.substring(0, text.indexOf('\n')) : text;
                  Notification.Builder b = new Notification.Builder(c, CHANNEL)
                          .setSmallIcon(R.drawable.ic_stat_mail)
                          .setColor(0xFFFF5C8A)
                          .setContentTitle(title)
                          .setContentText(first)
                          .setStyle(new Notification.BigTextStyle().bigText(text))
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .setWhen(System.currentTimeMillis())
                          .setShowWhen(true);
                  if (a != null) {
                      b.setSubText(a.email).setGroup("brisk_" + a.id);
                      if (folder != null) {
                          Icon ic = Icon.createWithResource(c, R.drawable.ic_stat_mail);
                          b.addAction(new Notification.Action.Builder(ic, "Archive", action(c, nid, a, folder, uid, "archive")).build());
                          b.addAction(new Notification.Action.Builder(ic, "Delete", action(c, nid, a, folder, uid, "trash")).build());
                          b.addAction(new Notification.Action.Builder(ic, "Mark read", action(c, nid, a, folder, uid, "read")).build());
                      }
                  }
                  try { nm.notify(nid, b.build()); } catch (SecurityException ignored) { }
              }
          }
