          import android.content.Context;
          import android.content.Intent;

          import javax.mail.Flags;
          import javax.mail.Message;

          import com.sun.mail.imap.IMAPFolder;

          /** Archive / Delete / Mark read buttons on a new-mail notification. */
          public class NotifyAction extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent in) {
                  final Context c = ctx.getApplicationContext();
                  final String acctId = in.getStringExtra("acct"), folder = in.getStringExtra("folder"), op = in.getStringExtra("op");
                  final long uid = in.getLongExtra("uid", -1);
                  final int nid = in.getIntExtra("nid", 0);
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm != null) nm.cancel(nid);
                  final PendingResult pr = goAsync();
                  new Thread(() -> {
                      Acct a = null;
                      try {
                          a = CheckJob.find(Acct.loadAll(c), acctId);
                          if (a == null || folder == null || uid < 0) return;
                          IMAPFolder f = Mail.folder(a, folder);
                          Message m = f.getMessageByUID(uid);
                          if (m == null) return;
                          Message[] arr = new Message[]{m};
                          if ("read".equals(op)) f.setFlags(arr, new Flags(Flags.Flag.SEEN), true);
                          else if ("archive".equals(op)) Mail.move(a, f, arr, Mail.special(a, "archive", "Archive"));
                          else if ("trash".equals(op)) Mail.move(a, f, arr, Mail.special(a, "trash", "Trash"));
                      } catch (Exception ignored) {
                      } finally {
                          if (a != null) Mail.closeAll(a);
                          pr.finish();
                      }
                  }).start();
              }
          }
