                          n.smtpSec = a.optString("smtpSec", "ssl");
                          synchronized (accounts) {
                              for (Acct x : accounts.values())
                                  if (x.email.equalsIgnoreCase(n.email)) throw new Exception(n.email + " is already added");
                          }
                          try {
                              n.store = Mail.connect(n);
                          } catch (javax.mail.AuthenticationFailedException ex) {
                              throw new Exception("The server rejected that email or password. Check you used an app password, not your normal one.");
                          }
                          synchronized (accounts) { accounts.put(n.id, n); }
                          saveAccounts();
                          return n.pub();
                      }
                      case "logout": {
                          Acct x;
                          synchronized (accounts) { x = accounts.remove(a.optString("acct", "")); }
                          if (x != null) {
                              synchronized (x) { Mail.closeAll(x); }
                              Acct.prefs(this).edit().remove("pw_" + x.id).remove("lastUid_" + x.id).remove("uidv_" + x.id).apply();
                              saveAccounts();
                          }
                          return new JSONObject();
                      }
                      case "notifyConfig": {
                          Acct.put(this, "notify", a);
                          if (a.optBoolean("enabled", true)) runOnUiThread(this::askNotifyPermission);
                          return new JSONObject();
                      }
                      case "snoozes": {
                          JSONObject o = new JSONObject();
                          o.put("items", Acct.arr(this, "snoozes"));
                          return o;
                      }
                      case "scheduled": {
                          JSONObject o = new JSONObject();
                          o.put("items", Acct.arr(this, "scheduled"));
                          return o;
                      }
                      case "schedule": {
                          JSONObject e = Mail.schedule(this, a.getJSONObject("payload"), a.getLong("at"));
                          CheckJob.scheduleNext(this);
                          return e;
                      }
                      case "unschedule": {
                          Mail.unschedule(this, a.getString("id"));
                          CheckJob.scheduleNext(this);
                          return new JSONObject();
                      }
                      case "wakeDue": {
                          int n = 0;
                          List<Acct> list;
                          synchronized (accounts) { list = new ArrayList<>(accounts.values()); }
                          for (Acct x : list) synchronized (x) { n += Mail.wake(this, x, null, false).size(); }
                          CheckJob.scheduleNext(this);
                          JSONObject o = new JSONObject();
                          o.put("woken", n);
                          return o;
                      }
                      default: {
                          Acct x = acct(a);
                          synchronized (x) {
                              try {
                                  return runFor(x, method, a);
                              } catch (javax.mail.FolderClosedException | javax.mail.StoreClosedException ex) {
                                  Mail.closeAll(x); // dropped connection: reconnect once and retry
                                  return runFor(x, method, a);
                              }
                          }
                      }
                  }
              }

              private javax.mail.Message[] byUids(IMAPFolder f, JSONArray uids) throws Exception {
                  return Mail.nonNull(f.getMessagesByUID(Mail.longs(uids)));
              }

              private Object runFor(Acct acct, String method, JSONObject a) throws Exception {
                  switch (method) {
                      case "folders":
                          return Mail.folders(acct);
                      case "list": {
                          JSONObject o = new JSONObject();
                          String path = a.getString("folder");
                          if (!"INBOX".equals(path) && !Mail.exists(acct, path)) {
                              o.put("total", 0); o.put("items", new JSONArray());
                              return o;
                          }
                          IMAPFolder f = Mail.folder(acct, path);
                          int offset = a.optInt("offset", 0), count = a.optInt("count", 40);
                          int total = f.getMessageCount();
                          int end = total - offset, start = Math.max(1, end - count + 1);
                          o.put("total", total);
                          o.put("items", end >= 1 ? Mail.summaries(acct, f, f.getMessages(start, end)) : new JSONArray());
                          return o;
                      }
                      case "snippets": {
                          IMAPFolder f = Mail.folder(acct, a.getString("folder"));
                          JSONObject out = new JSONObject();
                          for (javax.mail.Message m : byUids(f, a.getJSONArray("uids")))
                              out.put(String.valueOf(f.getUID(m)), Mail.snippet(m));
                          return out;
                      }
                      case "body": {
                          IMAPFolder f = Mail.folder(acct, a.getString("folder"));
                          javax.mail.Message m = Mail.byUid(f, a.getLong("uid"));
                          ((IMAPMessage) m).setPeek(true);
                          Mail.Body b = new Mail.Body();
                          Mail.walk(m, b);
                          if (!m.isSet(Flags.Flag.SEEN) && !a.optBoolean("peek", false)) m.setFlag(Flags.Flag.SEEN, true);
                          JSONObject o = Mail.summary(acct, f, m);
                          o.put("text", Mail.plain(b));
                          o.put("html", b.html == null ? JSONObject.NULL : b.html);
                          o.put("cc", Mail.addrs(m.getRecipients(javax.mail.Message.RecipientType.CC)));
                          o.put("replyTo", Mail.addrs(m.getReplyTo()));
                          o.put("messageId", Mail.header(m, "Message-ID"));
                          o.put("references", Mail.header(m, "References"));
                          o.put("unsub", Mail.header(m, "List-Unsubscribe"));
                          o.put("draftKey", Mail.header(m, "X-Brisk-Draft"));
                          JSONArray at = new JSONArray();
                          for (int i = 0; i < b.atts.size(); i++) {
                              Part p = b.atts.get(i);
                              JSONObject x = new JSONObject();
                              String fn = null;
                              try { fn = p.getFileName(); } catch (Exception ignored) { }
                              x.put("idx", i);
                              x.put("name", fn == null ? "attachment-" + (i + 1) : fn);
                              x.put("size", Math.max(0, p.getSize()));
                              at.put(x);
                          }
                          o.put("attachments", at);
                          return o;
                      }
                      case "attachment": {
                          if (Build.VERSION.SDK_INT < 29) throw new Exception("Saving attachments needs Android 10 or newer");
                          IMAPFolder f = Mail.folder(acct, a.getString("folder"));
                          javax.mail.Message m = Mail.byUid(f, a.getLong("uid"));
                          ((IMAPMessage) m).setPeek(true);
                          Mail.Body b = new Mail.Body();
                          Mail.walk(m, b);
                          Part p = b.atts.get(a.getInt("idx"));
                          String name = p.getFileName() == null ? "attachment" : p.getFileName();
                          String mime = p.getContentType() == null ? "application/octet-stream" : p.getContentType().split(";")[0].trim().toLowerCase();
                          ContentValues cv = new ContentValues();
                          cv.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          cv.put(MediaStore.Downloads.MIME_TYPE, mime);
                          cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Brisk");
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          if (uri == null) throw new Exception("Couldn't save to Downloads");
                          try (OutputStream out = getContentResolver().openOutputStream(uri); InputStream in = p.getInputStream()) {
                              byte[] buf = new byte[16384];
                              int n;
                              while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                          }
                          final Uri fu = uri;
                          final String fm = mime;
                          runOnUiThread(() -> {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW).setDataAndType(fu, fm)
                                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK));
                              } catch (Exception ignored) { }
                          });
                          JSONObject o = new JSONObject();
                          o.put("saved", "Downloads/Brisk/" + name);
                          return o;
                      }
                      case "search": {
                          String path = a.getString("folder");
                          JSONObject o = new JSONObject();
                          if (!"INBOX".equals(path) && !Mail.exists(acct, path)) {
                              o.put("total", 0); o.put("items", new JSONArray());
                              return o;
                          }
                          IMAPFolder f = Mail.folder(acct, path);
                          int max = a.optInt("count", 60);
                          javax.mail.Message[] found;
                          int total;
                          if (acct.gmail() && a.has("query")) {
                              final String q = a.getString("query");
                              @SuppressWarnings("unchecked")
                              List<Long> uids = (List<Long>) f.doCommand(pr -> {
                                  Argument args = new Argument();
                                  args.writeAtom("X-GM-RAW");
                                  args.writeString(q);
                                  Response[] rs = pr.command("UID SEARCH", args);
                                  List<Long> list = new ArrayList<>();
                                  for (Response r : rs) {
                                      if (r instanceof IMAPResponse && ((IMAPResponse) r).keyEquals("SEARCH")) {
                                          long n;
                                          while ((n = r.readNumber()) != -1) list.add(n);
                                      }
                                  }
                                  pr.notifyResponseHandlers(rs);
                                  pr.handleResult(rs[rs.length - 1]);
                                  return list;
                              });
                              total = uids.size();
                              int from = Math.max(0, uids.size() - max);
                              long[] u = new long[uids.size() - from];
                              for (int i = 0; i < u.length; i++) u[i] = uids.get(from + i);
                              found = u.length > 0 ? f.getMessagesByUID(u) : new javax.mail.Message[0];
                          } else {
                              JSONArray terms = a.optJSONArray("terms");
                              SearchTerm st = null;
                              if (terms != null) {
                                  for (int i = 0; i < terms.length(); i++) {
                                      String t = terms.getString(i);
                                      SearchTerm one = a.optBoolean("fromOnly", false) ? new FromStringTerm(t)
                                              : new OrTerm(new SearchTerm[]{new SubjectTerm(t), new FromStringTerm(t), new BodyTerm(t)});
                                      st = st == null ? one : new AndTerm(st, one);
                                  }
                              }
                              javax.mail.Message[] all = st == null ? new javax.mail.Message[0] : f.search(st);
                              total = all.length;
                              found = Arrays.copyOfRange(all, Math.max(0, all.length - max), all.length);
                          }
                          o.put("total", total);
                          o.put("items", found.length > 0 ? Mail.summaries(acct, f, found) : new JSONArray());
                          return o;
                      }
                      case "act": {
                          IMAPFolder f = Mail.folder(acct, a.getString("folder"));
                          javax.mail.Message[] arr = byUids(f, a.getJSONArray("uids"));
                          if (arr.length == 0) return new JSONObject();
                          String op = a.getString("op");
                          switch (op) {
                              case "read": f.setFlags(arr, new Flags(Flags.Flag.SEEN), true); break;
                              case "unread": f.setFlags(arr, new Flags(Flags.Flag.SEEN), false); break;
                              case "star": f.setFlags(arr, new Flags(Flags.Flag.FLAGGED), true); break;
                              case "unstar": f.setFlags(arr, new Flags(Flags.Flag.FLAGGED), false); break;
                              case "move": Mail.move(acct, f, arr, a.getString("to")); break;
                              case "delete": Mail.deleteForever(f, arr); break;
                              default: throw new Exception("Unknown action " + op);
                          }
                          return new JSONObject();
                      }
                      case "empty": {
                          IMAPFolder f = Mail.folder(acct, a.getString("folder"));
                          javax.mail.Message[] all = f.getMessages();
                          JSONObject o = new JSONObject();
                          o.put("deleted", all.length);
                          if (all.length > 0) {
                              f.setFlags(all, new Flags(Flags.Flag.DELETED), true);
                              f.expunge();
                          }
                          return o;
                      }
                      case "snooze": {
                          IMAPFolder f = Mail.folder(acct, a.getString("folder"));
                          javax.mail.Message[] arr = byUids(f, a.getJSONArray("uids"));
                          f.fetch(arr, Mail.listProfile());
                          Mail.snooze(this, acct, f, arr, a.getLong("until"));
                          CheckJob.scheduleNext(this);
                          return new JSONObject();
                      }
                      case "wake": {
                          JSONObject o = new JSONObject();
                          o.put("woken", Mail.wake(this, acct, a.getString("mid"), true).size());
                          CheckJob.scheduleNext(this);
                          return o;
                      }
                      case "unsubscribe": {
                          // Try the given email first, then other recent ones from the same sender.
                          JSONArray cands = a.getJSONArray("cands");
                          Exception last = null;
                          for (int i = 0; i < cands.length(); i++) {
                              JSONObject c = cands.getJSONObject(i);
                              try {
                                  if (!"INBOX".equals(c.getString("folder")) && !Mail.exists(acct, c.getString("folder"))) continue;
                                  IMAPFolder f = Mail.folder(acct, c.getString("folder"));
                                  javax.mail.Message m = f.getMessageByUID(c.getLong("uid"));
                                  if (m == null) continue;
                                  JSONObject r = Mail.unsubscribe(acct, m);
                                  if (!"none".equals(r.optString("method")) || i == cands.length() - 1) return r;
                              } catch (Exception e) { last = e; }
                          }
                          if (last != null) throw last;
                          JSONObject r = new JSONObject();
                          r.put("method", "none");
                          return r;
                      }
                      case "saveDraft":
                          Mail.saveDraft(acct, a);
                          return new JSONObject();
                      case "deleteDraft":
                          Mail.deleteDraft(acct, a.getString("folder"), a.getString("draftKey"));
                          return new JSONObject();
                      default:
                          throw new Exception("Unknown method " + method);
                  }
              }

              private void reply(int id, boolean ok, String json) {
                  web.post(() -> web.evaluateJavascript("window.__brisk(" + id + "," + ok + "," + json + ")", null));
              }

              private static String friendly(Exception e) {
                  String m = e.getMessage();
                  if (e instanceof java.net.UnknownHostException || (m != null && m.contains("Couldn't connect")))
                      return "Couldn't reach the mail server. Check your internet and the server name.";
                  return m == null ? e.getClass().getSimpleName() : m;
              }

              private void askNotifyPermission() {
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, REQ_NOTIFY);
                  }
              }

              private class Bridge {
                  @JavascriptInterface
                  public void call(int id, String method, String json) {
                      ExecutorService pool = "send".equals(method) || "sendNow".equals(method) ? smtpPool : imapPool;
                      pool.execute(() -> {
                          try {
                              JSONObject args = json == null || json.isEmpty() ? new JSONObject() : new JSONObject(json);
                              Object r;
                              if ("send".equals(method)) {
                                  Mail.send(acct(args), args);
                                  r = new JSONObject();
                              } else if ("sendNow".equals(method)) {
                                  String sid = args.getString("id");
                                  JSONObject p = Mail.payload(MainActivity.this, sid);
                                  Mail.send(acct(p), p);
                                  Mail.unschedule(MainActivity.this, sid);
                                  CheckJob.scheduleNext(MainActivity.this);
                                  r = new JSONObject();
                              } else r = run(method, args);
                              reply(id, true, r.toString());
                          } catch (Exception e) {
                              reply(id, false, JSONObject.quote(friendly(e)));
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openUrl(String url) { runOnUiThread(() -> openExternal(url)); }

                  @JavascriptInterface
                  public String version() {
                      try {
                          return getPackageManager().getPackageInfo(getPackageName(), 0).versionName;
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public String takeLaunch() {
                      String l = launch;
                      launch = null;
                      return l == null ? "" : l;
                  }

                  @JavascriptInterface
                  public void setWidget(String json) {
                      try {
                          JSONObject o = new JSONObject(json);
                          o.put("t", System.currentTimeMillis());
                          Acct.put(MainActivity.this, "widget", o);
                          BriskWidget.updateAll(MainActivity.this);
                      } catch (Exception ignored) { }
                  }

                  @JavascriptInterface
                  public void setTextZoom(int z) {
                      Acct.prefs(MainActivity.this).edit().putInt("textZoom", z).apply();
                      runOnUiThread(() -> web.getSettings().setTextZoom(z));
                  }

                  @JavascriptInterface
                  public String setLock(boolean on) {
                      if (on) {
                          KeyguardManager km = getSystemService(KeyguardManager.class);
                          if (km == null || !km.isDeviceSecure()) return "Set a screen lock (PIN, pattern or fingerprint) on your phone first.";
                      }
                      Acct.prefs(MainActivity.this).edit().putBoolean("lock", on).apply();
                      if (on) { unlocked = true; pausedAt = System.currentTimeMillis(); }
                      return "";
                  }

                  @JavascriptInterface
                  public void addEvent(String title, long begin, long end, boolean allDay, String desc) {
                      runOnUiThread(() -> {
                          try {
                              Intent i = new Intent(Intent.ACTION_INSERT).setData(CalendarContract.Events.CONTENT_URI)
                                      .putExtra(CalendarContract.EXTRA_EVENT_BEGIN_TIME, begin)
                                      .putExtra(CalendarContract.EXTRA_EVENT_END_TIME, end)
                                      .putExtra(CalendarContract.EXTRA_EVENT_ALL_DAY, allDay)
                                      .putExtra(CalendarContract.Events.TITLE, title)
                                      .putExtra(CalendarContract.Events.DESCRIPTION, desc);
                              startActivity(i);
                          } catch (Exception ignored) { }
                      });
                  }

                  @JavascriptInterface
                  public void cancelNotify(String acctId, long uid) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.cancel((acctId + uid).hashCode());
                  }

                  @JavascriptInterface
                  public void checkNow() {
                      new Thread(() -> CheckJob.work(getApplicationContext())).start();
                  }
              }
          }
