name: Build Brisk APK

# Self-contained: this one file generates the whole Android project,
# so the repo only needs index.html plus this workflow.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          set -e
          rm -rf android
          mkdir -p android
          cat > android/settings.gradle <<'BRISK_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Brisk"
          include ':app'
          BRISK_EOF
          mkdir -p android
          cat > android/build.gradle <<'BRISK_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          BRISK_EOF
          mkdir -p android
          cat > android/gradle.properties <<'BRISK_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          BRISK_EOF
          mkdir -p android/app
          cat > android/app/build.gradle <<'BRISK_EOF'
          plugins {
              id 'com.android.application'
          }

          def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

          android {
              namespace 'com.daveg27.brisk'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.daveg27.brisk'
                  minSdk 26
                  targetSdk 34
                  versionCode runNo
                  versionName "1.0.${runNo}"
              }

              signingConfigs {
                  // Fixed key so each new build installs over the previous one.
                  brisk {
                      storeFile file('brisk.keystore')
                      storePassword 'brisk-mail-key'
                      keyAlias 'brisk'
                      keyPassword 'brisk-mail-key'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.brisk
                  }
                  debug {
                      signingConfig signingConfigs.brisk
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/DEPENDENCIES']
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              // JavaMail for Android: IMAP (reading/searching) and SMTP (sending)
              implementation 'com.sun.mail:android-mail:1.6.7'
              implementation 'com.sun.mail:android-activation:1.6.7'
          }
          BRISK_EOF
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'BRISK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />

              <application
                  android:label="Brisk"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/BriskTheme"
                  android:hardwareAccelerated="true"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode|density"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CheckJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />

                  <receiver
                      android:name=".NotifyAction"
                      android:exported="false" />

                  <receiver
                      android:name=".BriskWidget"
                      android:label="Brisk inbox"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/brisk_widget_info" />
                  </receiver>
              </application>
          </manifest>
